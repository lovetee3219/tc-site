<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熱帶氣旋觀測站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --panel: rgba(244, 247, 249, .94);
    --panel-solid: #f4f7f9;
    --ink: #13283a;
    --ink-soft: #4d6273;
    --rule: #c9d5de;
    --accent: #0b6e8a;      /* 海水藍：互動元件 */
    --warn: #c4471d;        /* 警示橘：目前時間、示範資料提醒 */
    --shadow: 0 6px 24px rgba(10, 30, 45, .25);
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --num: "Barlow Semi Condensed", "Arial Narrow", var(--sans);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(15, 37, 53, .92);
      --panel-solid: #0f2535;
      --ink: #e4edf2;
      --ink-soft: #9db2c0;
      --rule: #2a4558;
      --accent: #5cc4dd;
      --warn: #ff9a6b;
      --shadow: 0 6px 24px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(15, 37, 53, .92); --panel-solid: #0f2535; --ink: #e4edf2; --ink-soft: #9db2c0;
    --rule: #2a4558; --accent: #5cc4dd; --warn: #ff9a6b; --shadow: 0 6px 24px rgba(0,0,0,.45); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0e2232; font-family: var(--sans); color: var(--ink); font-size: 15px; }
  #map { position: fixed; inset: 0; background: #0e2232; }

  /* 左側控制面板 */
  .panel {
    position: fixed; z-index: 1000;
    top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px;
    width: 300px; max-height: calc(100% - 120px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; background: var(--panel); backdrop-filter: blur(8px);
    border-radius: 10px; box-shadow: var(--shadow); padding: 16px 16px 8px;
  }
  .panel h1 { font-size: 19px; font-weight: 700; margin: 0 0 2px; letter-spacing: .02em; }
  .updated { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .group { border-top: 1px solid var(--rule); padding: 12px 0; }
  .group h2 { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; cursor: pointer; }
  .row input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
  .note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0 0; }
  .note.warn { color: var(--warn); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; padding: 6px 0; border: 0; background: transparent; color: var(--ink); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel-solid); font-weight: 500; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  label.slider { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }

  .storm-name { font-weight: 700; font-size: 14.5px; }
  .storm { border-top: 1px dashed var(--rule); padding: 6px 0 2px; }
  .storm:first-child { border-top: 0; }
  .storm-head { padding: 4px 0; }
  .basin-tag { margin-left: auto; font-size: 12px; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .storm-body { padding-left: 24px; }
  .cat { font-size: 12.5px; color: var(--ink-soft); margin: 8px 0 2px; }
  .swatch { width: 22px; height: 0; border-top: 3px solid; flex: none; }
  .swatch.nwp { border-top-style: dashed; }
  .swatch.ai { border-top-style: dotted; border-top-width: 4px; }
  .model-code { margin-left: auto; font-family: var(--num); color: var(--ink-soft); font-size: 13px; }
  .row.model { align-items: flex-start; }
  .row.model input, .row.model .swatch { margin-top: 4px; }
  .row.model .swatch { margin-top: 9px; }
  .model-text { display: flex; flex-direction: column; line-height: 1.3; }
  .model-init { font-size: 12px; color: var(--ink-soft); font-family: var(--num); letter-spacing: .02em; }
  .model-init.stale { color: var(--warn); }
  .pixelated img { image-rendering: pixelated; }
  .grid-label { font-family: var(--num); font-size: 12px; font-weight: 500; color: rgba(255,255,255,.75); text-shadow: 0 0 3px #000; white-space: nowrap; }
  .intensity { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; margin-top: 6px; }
  .intensity span { font-size: 11px; text-align: center; padding: 2px 0; border-radius: 3px; color: #10202c; }

  .toggle-panel { display: none; }

  /* 底部時間列：整個網站最醒目的元素 */
  .timebar {
    position: fixed; z-index: 1000; left: 324px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); border-radius: 10px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 14px; padding: 10px 16px;
  }
  .play {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--panel-solid);
    font-size: 15px; cursor: pointer;
  }
  .clock { font-family: var(--num); line-height: 1.05; min-width: 150px; }
  .clock .utc { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .clock .local { font-size: 13px; color: var(--ink-soft); font-family: var(--sans); }
  .timebar input { margin: 0; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }

  .leaflet-tooltip.tc-tip {
    font-family: var(--sans); font-size: 12.5px; background: var(--panel-solid); color: var(--ink);
    border: 1px solid var(--rule); box-shadow: var(--shadow);
  }
  .tau-label { font-family: var(--num); font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; }
  .leaflet-control-attribution { font-size: 10.5px; }

  @media (max-width: 720px) {
    .panel { top: auto; left: 0; right: 0; width: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
             max-height: 55%; border-radius: 12px 12px 0 0; transform: translateY(calc(100% + 80px)); transition: transform .25s; }
    .panel.open { transform: none; }
    .toggle-panel {
      display: block; position: fixed; z-index: 1001; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
      font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 0;
      background: var(--panel-solid); color: var(--ink); box-shadow: var(--shadow);
    }
    .timebar { left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); gap: 10px; padding: 8px 12px; }
    .clock { min-width: 118px; } .clock .utc { font-size: 21px; }
    .leaflet-control-zoom { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<div id="map" aria-label="地圖"></div>

<button class="toggle-panel" id="togglePanel" aria-expanded="false" aria-controls="panel">圖層</button>

<aside class="panel" id="panel">
  <h1>熱帶氣旋觀測站</h1>
  <p class="updated" id="updated">讀取資料中…</p>

  <section class="group">
    <h2>衛星雲圖</h2>
    <div class="seg" role="group" aria-label="衛星頻道">
      <button data-sat="ir" aria-pressed="true">紅外線</button>
      <button data-sat="airmass" aria-pressed="false">空氣團</button>
      <button data-sat="vis" aria-pressed="false">可見光</button>
      <button data-sat="off" aria-pressed="false">關閉</button>
    </div>
    <label class="slider">透明度<input type="range" id="satOpacity" min="0.2" max="1" step="0.05" value="0.85"></label>
    <p class="note">GOES 東／西與向日葵衛星，NASA GIBS 提供。紅外線與空氣團解析度約 2 公里，可見光約 1 公里（僅白天）。印度洋與非洲上空沒有涵蓋。</p>
  </section>

  <section class="group">
    <h2>疊加圖層</h2>
    <label class="row"><input type="checkbox" id="radarToggle"> 雷達回波（RainViewer）</label>
    <label class="row"><input type="checkbox" id="sstToggle"> 海溫（GHRSST MUR，前一日）</label>
    <label class="row"><input type="checkbox" id="gridToggle" checked> 經緯線</label>
  </section>

  <section class="group" id="trackGroup">
    <h2>路徑預報</h2>
    <div id="storms"><p class="note">讀取中…</p></div>
    <div class="cat">最佳路徑強度（節）</div>
    <div class="intensity" id="intensityLegend"></div>
  </section>
</aside>

<div class="timebar" role="group" aria-label="衛星時間">
  <button class="play" id="play" aria-label="播放動畫">▶</button>
  <div class="clock"><div class="utc" id="clockUtc">--</div><div class="local" id="clockLocal"></div></div>
  <input type="range" id="timeSlider" min="0" max="11" step="1" value="11" aria-label="選擇時間">
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===================== 設定區：想調整的東西大多在這裡 ===================== */
const CONFIG = {
  center: [20, 135], zoom: 4,
  frames: 12,          // 動畫張數
  stepMin: 20,         // 每張相隔幾分鐘
  latencyMin: 60,      // GIBS 即時資料大約延遲多久才上線
  // NASA GIBS 圖層名稱（可到 NASA Worldview 查更多）
  // 每顆衛星的星下點經度：畫面離衛星太遠時就不下載那顆衛星的圖，節省流量
  satLon: { "GOES-West": -137.2, "GOES-East": -75.2, "Himawari": 140.7 },
  sat: {
    ir:      { level: 6, layers: ["GOES-West_ABI_Band13_Clean_Infrared", "GOES-East_ABI_Band13_Clean_Infrared", "Himawari_AHI_Band13_Clean_Infrared"] },
    airmass: { level: 6, layers: ["GOES-West_ABI_Air_Mass", "GOES-East_ABI_Air_Mass", "Himawari_AHI_Air_Mass"] },
    vis:     { level: 7, layers: ["GOES-West_ABI_Band2_Red_Visible_1km", "GOES-East_ABI_Band2_Red_Visible_1km", "Himawari_AHI_Band3_Red_Visible_1km"] },
  },
  sstLayer: "GHRSST_L4_MUR_Sea_Surface_Temperature",
  // 海陸邊界線：顏色與粗細可自行調整
  coast: {
    color: "#f2d14b",
    weight: 1,
    detailZoom: 5,     // 放大到這個等級以上，改用精細海岸線
  },
  grid: { color: "#ffffff", opacity: 0.35 },
  defaultBasin: "WP",   // 一進網頁只先顯示這個海域的颱風（WP = 西北太平洋）
  // 路徑顏色：官方用白色實線，數值模式用冷色虛線，AI 模式用暖色點線
  palette: {
    official: ["#ffffff", "#ffe066"],
    nwp: ["#4cc9f0", "#4895ef", "#80ed99", "#56cfe1", "#a0c4ff", "#72efdd", "#b8f2e6"],
    ai: ["#ff70a6", "#ff9770", "#ffd670", "#e980fc"],
    ens: ["#8fd3ff", "#b5f5c4", "#d4c2ff", "#a0c4ff", "#c7f9cc"],   // 系集成員：細線、半透明
  },
  // 指定特定來源的顏色（優先於上面的 palette）
  modelColors: {
    JTWC: "#ffffff", OFCL: "#ffffff", RJTD: "#ff6b6b", RCTP: "#ffd23f", VHHH: "#7ee0a1",
    ECMF: "#4895ef", EEMN: "#90c2ff", AIFS: "#ff70a6", AIEMN: "#ffa3c7",
  },
  groupColors: { "ECMWF 系集成員": "#90c2ff", "AIFS 系集成員": "#ffa3c7" },
};
/* ======================================================================== */

const GIBS = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best";
const map = L.map("map", { worldCopyJump: true, minZoom: 2, maxZoom: 9, zoomControl: false })
  .setView(CONFIG.center, CONFIG.zoom);
L.control.zoom({ position: "topright" }).addTo(map);

// 只畫海陸邊界線（Natural Earth 1:5000 萬海岸線，公有領域資料）
map.attributionControl.setPrefix(false).addAttribution(
  '海岸線：<a href="https://www.naturalearthdata.com/">Natural Earth</a> · 衛星與海溫：<a href="https://earthdata.nasa.gov/gibs">NASA GIBS</a>' +
  ' · 路徑：<a href="https://www.jma.go.jp/">気象庁</a>、<a href="https://www.cwa.gov.tw/">中央氣象署</a>、JTWC、NCAR TCGP、' +
  'Based on data and products of <a href="https://www.ecmwf.int/">ECMWF</a> (CC BY 4.0)');
map.createPane("coast").style.zIndex = 450;   // 在雲圖、雷達之上，路徑之下
map.getPane("coast").style.pointerEvents = "none";
const coastRenderer = L.canvas({ pane: "coast" });
const coastStyle = () => ({ renderer: coastRenderer, interactive: false, color: CONFIG.coast.color, weight: CONFIG.coast.weight, opacity: 0.9 });
const toLatLngs = (lines, offset) => lines.map(l => l.map(([x, y]) => [y, x + offset]));

// 縮小時：整份 1:5000 萬海岸線，左右各多畫一份，跨越換日線才不會斷
const coarseCoast = L.layerGroup();
fetch("data/coast_50m.json").then(r => r.json()).then(lines => {
  [-360, 0, 360].forEach(off => L.polyline(toLatLngs(lines, off), coastStyle()).addTo(coarseCoast));
  updateCoast();
}).catch(() => console.warn("海岸線載入失敗：請確認 data/coast_50m.json 存在"));

// 放大時：1:1000 萬精細海岸線，切成 10°×10° 小塊，只下載畫面範圍內的
const fineCoast = L.layerGroup(), fineCache = {}, fineShown = {};
let fineIndex = null;
fetch("data/coast10/index.json").then(r => r.json()).then(list => { fineIndex = new Set(list); updateCoast(); }).catch(() => {});

function updateCoast() {
  const fine = map.getZoom() >= CONFIG.coast.detailZoom && fineIndex;
  if (fine) { map.removeLayer(coarseCoast); fineCoast.addTo(map); }
  else { map.removeLayer(fineCoast); coarseCoast.addTo(map); return; }
  const b = map.getBounds().pad(0.3);
  const want = new Set();
  for (let lat = Math.floor(b.getSouth() / 10) * 10; lat < b.getNorth(); lat += 10) {
    for (let lonU = Math.floor(b.getWest() / 10) * 10; lonU < b.getEast(); lonU += 10) {
      const off = Math.floor((lonU + 180) / 360) * 360;
      const key = `${lat}_${lonU - off}`;
      if (fineIndex.has(key)) want.add(`${key}@${off}`);
    }
  }
  Object.keys(fineShown).forEach(k => { if (!want.has(k)) { fineCoast.removeLayer(fineShown[k]); delete fineShown[k]; } });
  want.forEach(k => {
    if (fineShown[k]) return;
    const [key, off] = k.split("@");
    fineShown[k] = L.layerGroup().addTo(fineCoast);
    (fineCache[key] ||= fetch(`data/coast10/${key}.json`).then(r => r.json()))
      .then(lines => fineShown[k] && L.polyline(toLatLngs(lines, +off), coastStyle()).addTo(fineShown[k]));
  });
}
map.on("moveend", updateCoast);

/* ---------- 經緯線：依縮放等級調整間距，最密 1° ---------- */
map.createPane("grid").style.zIndex = 440;
map.getPane("grid").style.pointerEvents = "none";
const gridLayer = L.layerGroup(), gridRenderer = L.canvas({ pane: "grid" });
const gridStep = z => z <= 2 ? 30 : z <= 3 ? 20 : z <= 4 ? 10 : z <= 5 ? 5 : z <= 6 ? 2 : 1;
const fmtLat = v => v === 0 ? "0°" : `${Math.abs(v)}°${v > 0 ? "N" : "S"}`;
const fmtLon = v => { const n = ((v + 180) % 360 + 360) % 360 - 180; return n === 0 || n === -180 ? (n ? "180°" : "0°") : `${Math.abs(n)}°${n > 0 ? "E" : "W"}`; };
function drawGrid() {
  gridLayer.clearLayers();
  if (!document.getElementById("gridToggle").checked) return;
  const v = map.getBounds(), b = v.pad(0.2), st = gridStep(map.getZoom());
  const style = { renderer: gridRenderer, interactive: false, color: CONFIG.grid.color, opacity: CONFIG.grid.opacity, weight: 0.8 };
  const lat0 = Math.max(-80, Math.ceil(b.getSouth() / st) * st), lat1 = Math.min(80, Math.floor(b.getNorth() / st) * st);
  const lon0 = Math.ceil(b.getWest() / st) * st, lon1 = Math.floor(b.getEast() / st) * st;
  const label = (ll, text, anchor) => L.marker(ll, { pane: "grid", interactive: false, keyboard: false,
    icon: L.divIcon({ className: "grid-label", html: text, iconSize: null, iconAnchor: anchor }) }).addTo(gridLayer);
  for (let lat = lat0; lat <= lat1; lat += st) {
    L.polyline([[lat, b.getWest()], [lat, b.getEast()]], style).addTo(gridLayer);
    if (lat > v.getSouth() && lat < v.getNorth()) label([lat, v.getEast()], fmtLat(lat), [44, 7]);   // 緯度標在右緣
  }
  for (let lon = lon0; lon <= lon1; lon += st) {
    L.polyline([[Math.max(-85, b.getSouth()), lon], [Math.min(85, b.getNorth()), lon]], style).addTo(gridLayer);
    if (lon > v.getWest() && lon < v.getEast()) label([v.getNorth(), lon], fmtLon(lon), [-3, -4]);    // 經度標在上緣
  }
}
gridLayer.addTo(map);
map.on("moveend", drawGrid);
document.getElementById("gridToggle").addEventListener("change", drawGrid);

/* ---------- 時間軸 ---------- */
function latestTime() {
  const t = new Date(Date.now() - CONFIG.latencyMin * 60000);
  t.setUTCSeconds(0, 0);
  t.setUTCMinutes(t.getUTCMinutes() - (t.getUTCMinutes() % 10));
  return t;
}
const t0 = latestTime();
const times = Array.from({ length: CONFIG.frames }, (_, i) =>
  new Date(t0.getTime() - (CONFIG.frames - 1 - i) * CONFIG.stepMin * 60000));
const gibsTime = d => d.toISOString().slice(0, 19) + "Z";
let frame = CONFIG.frames - 1;

const slider = document.getElementById("timeSlider");
slider.max = CONFIG.frames - 1; slider.value = frame;

function showClock() {
  const d = times[frame];
  document.getElementById("clockUtc").textContent =
    `${String(d.getUTCMonth() + 1).padStart(2, "0")}/${String(d.getUTCDate()).padStart(2, "0")} ${d.toISOString().slice(11, 16)} UTC`;
  document.getElementById("clockLocal").textContent =
    "本地 " + d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
}

/* ---------- 衛星雲圖 ----------
   載入策略：平常只下載「目前這一張」；按下播放才下載其餘時間的圖。
   而且只下載畫面看得到的衛星（例如看西太平洋時不抓 GOES-East）。 */
let satMode = "ir", satOpacity = 0.85, satGroups = [], satKey = "", timer = null;
map.createPane("sat").style.zIndex = 250;

function activeSatLayers() {
  if (satMode === "off") return [];
  const b = map.getBounds(), w = b.getWest(), e = b.getEast();
  return CONFIG.sat[satMode].layers.filter(name => {
    const sub = CONFIG.satLon[name.split("_")[0]];
    if (sub === undefined || e - w >= 300) return true;
    for (let lon = w; lon <= e + 5; lon += 5) {
      if (Math.abs((((lon - sub) % 360) + 540) % 360 - 180) < 80) return true;
    }
    return false;
  });
}
function satGroup(i) {
  if (!satGroups[i]) {
    const { level } = CONFIG.sat[satMode];
    satGroups[i] = L.layerGroup(activeSatLayers().map(name =>
      L.tileLayer(`${GIBS}/${name}/default/${gibsTime(times[i])}/GoogleMapsCompatible_Level${level}/{z}/{y}/{x}.png`, {
        pane: "sat", maxNativeZoom: level, maxZoom: 9, opacity: 0, bounds: [[-85, -180], [85, 180]],
      })));
  }
  return satGroups[i];
}
function whenLoaded(group, cb) {
  const ls = group.getLayers(); let n = 0;
  if (!ls.length) return cb();
  ls.forEach(l => (l.isLoading() ? l.once("load", () => ++n === ls.length && cb()) : ++n === ls.length && cb()));
}
function pruneSat() {   // 沒在播放時，把其他時間的圖層拿掉，平移縮放就不會重複下載
  if (timer) return;
  satGroups.forEach((g, i) => { if (g && i !== frame && map.hasLayer(g)) map.removeLayer(g); });
}
// 放大超過衛星原始解析度時，用「像素清晰」方式放大，不做模糊內插，看得出真實的雲頂細節
function updateSatSharpness() {
  const lv = satMode === "off" ? 99 : CONFIG.sat[satMode].level;
  map.getPane("sat").classList.toggle("pixelated", map.getZoom() > lv);
}
map.on("zoomend", updateSatSharpness);

function showSatFrame() {
  updateSatSharpness();
  if (satMode === "off") return;
  const g = satGroup(frame);
  if (!map.hasLayer(g)) g.addTo(map);
  g.eachLayer(l => l.setOpacity(satOpacity));
  satGroups.forEach((o, i) => { if (o && i !== frame) o.eachLayer(l => l.setOpacity(0)); });
  whenLoaded(g, pruneSat);   // 新的一張載完才移除舊的，避免閃一下空白
}
function buildSat(force) {
  const key = satMode + ":" + activeSatLayers().join(",");
  if (!force && key === satKey) return;
  satKey = key;
  satGroups.forEach(g => g && map.removeLayer(g));
  satGroups = [];
  if (timer) times.forEach((_, i) => satGroup(i).addTo(map));
  showSatFrame();
}
map.on("moveend", () => buildSat());

document.querySelectorAll("[data-sat]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-sat]").forEach(x => x.setAttribute("aria-pressed", x === b));
  satMode = b.dataset.sat; buildSat(true);
}));
document.getElementById("satOpacity").addEventListener("input", e => { satOpacity = +e.target.value; showSatFrame(); });

/* ---------- 雷達（RainViewer 免費版：最高縮放 7、僅過去資料、個人／教育用途） ---------- */
let radarFrames = [], radarLayer = null;
map.createPane("radar").style.zIndex = 300;
async function loadRadar() {
  const r = await fetch("https://api.rainviewer.com/public/weather-maps.json").then(r => r.json());
  radarFrames = r.radar.past.map(p => ({ time: p.time * 1000, url: `${r.host}${p.path}/256/{z}/{x}/{y}/2/1_1.png` }));
}
async function showRadar() {
  const on = document.getElementById("radarToggle").checked;
  if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
  if (!on) return;
  if (!radarFrames.length) { try { await loadRadar(); } catch { return; } }
  // 找最接近目前滑桿時間的雷達圖（雷達只保留約 2 小時）
  const target = times[frame].getTime();
  const f = radarFrames.reduce((a, b) => Math.abs(b.time - target) < Math.abs(a.time - target) ? b : a);
  radarLayer = L.tileLayer(f.url, { pane: "radar", maxNativeZoom: 7, maxZoom: 9, opacity: .8,
    attribution: '雷達：<a href="https://www.rainviewer.com/">RainViewer</a>' }).addTo(map);
}
document.getElementById("radarToggle").addEventListener("change", showRadar);

/* ---------- 海溫 ---------- */
let sstLayer = null;
map.createPane("sst").style.zIndex = 240;
document.getElementById("sstToggle").addEventListener("change", e => {
  if (sstLayer) { map.removeLayer(sstLayer); sstLayer = null; }
  if (!e.target.checked) return;
  const day = new Date(Date.now() - 36 * 3600000).toISOString().slice(0, 10);
  sstLayer = L.tileLayer(`${GIBS}/${CONFIG.sstLayer}/default/${day}/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png`,
    { pane: "sst", maxNativeZoom: 7, maxZoom: 9, opacity: .75 }).addTo(map);
});

/* ---------- 路徑預報 ---------- */
const KT_SCALE = [ // [下限, 顏色, 標籤]，參考薩菲爾－辛普森等級
  [0, "#7fb3d5", "<34"], [34, "#7ee0a1", "34"], [64, "#ffe066", "64"],
  [83, "#ffb347", "83"], [96, "#ff6b6b", "96"], [113, "#d65db1", "113+"],
];
const ktColor = kt => (KT_SCALE.filter(s => (kt ?? 0) >= s[0]).pop() || KT_SCALE[0])[1];
document.getElementById("intensityLegend").innerHTML =
  KT_SCALE.map(([, c, t]) => `<span style="background:${c}">${t}</span>`).join("");

// 讓跨越國際換日線的路徑連續，不會繞地球一圈
function unwrap(pts) {
  let prev = null;
  return pts.map(p => {
    let lon = p.lon;
    if (prev !== null) { while (lon - prev > 180) lon -= 360; while (prev - lon > 180) lon += 360; }
    prev = lon; return [p.lat, lon];
  });
}
const fmtTime = iso => {
  const d = new Date(iso);
  return `${d.toISOString().slice(5, 16).replace("T", " ")} UTC（本地 ${d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false })}）`;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

map.createPane("tracks").style.zIndex = 500;
const trackLayers = {};  // key -> layerGroup

function drawForecast(f, color) {
  const g = L.layerGroup();
  const ll = unwrap(f.points);
  const style = { official: { weight: 3.5, dashArray: null }, nwp: { weight: 2, dashArray: "7 5" }, ai: { weight: 2.5, dashArray: "1 6", lineCap: "round" } }[f.category];
  L.polyline(ll, { pane: "tracks", color, opacity: .95, ...style }).addTo(g);
  f.points.forEach((p, i) => {
    const valid = new Date(new Date(f.init).getTime() + p.tau * 3600000).toISOString();
    const m = L.circleMarker(ll[i], { pane: "tracks", radius: f.category === "official" ? 4 : 2.5, color, fillColor: color, fillOpacity: 1, weight: 1 })
      .bindTooltip(`<b>${esc(f.label)}</b>　+${p.tau} 小時<br>${fmtTime(valid)}${p.vmax ? `<br>最大風速 ${p.vmax} 節` : ""}${p.mslp ? `　${p.mslp} hPa` : ""}`, { className: "tc-tip" });
    m.addTo(g);
    if (f.tauLabels && p.tau > 0 && p.tau % 24 === 0) {
      L.marker(ll[i], { pane: "tracks", interactive: false, icon: L.divIcon({ className: "tau-label", html: `${p.tau}h`, iconAnchor: [-6, 8] }) }).addTo(g);
    }
  });
  return g;
}

function drawBest(storm) {
  const g = L.layerGroup();
  const ll = unwrap(storm.best);
  L.polyline(ll, { pane: "tracks", color: "#ffffff", weight: 1.5, opacity: .7 }).addTo(g);
  storm.best.forEach((p, i) => L.circleMarker(ll[i], { pane: "tracks", radius: 5, color: "#10202c", weight: 1, fillColor: ktColor(p.vmax), fillOpacity: 1 })
    .bindTooltip(`<b>${esc(storm.name)}</b><br>${fmtTime(p.time)}<br>最大風速 ${p.vmax ?? "—"} 節${p.mslp ? `　${p.mslp} hPa` : ""}`, { className: "tc-tip" })
    .addTo(g));
  return g;
}

const BASIN_NAME = { WP: "西北太平洋", EP: "東太平洋", CP: "中太平洋", AL: "大西洋", IO: "北印度洋", SH: "南半球" };
const stormKeys = {};
// 依勾選狀態把某個颱風的路徑加到地圖或移除：颱風總開關與個別路徑都勾選才顯示
function syncStorm(sid) {
  const box = document.getElementById("storms");
  const head = [...box.querySelectorAll("[data-storm]")].find(x => x.dataset.storm === sid);
  (stormKeys[sid] || []).forEach(k => {
    const cb = [...box.querySelectorAll("[data-key]")].find(x => x.dataset.key === k);
    const l = trackLayers[k];
    if (!l) return;
    if (head && head.checked && cb && cb.checked) l.addTo(map); else map.removeLayer(l);
  });
}

async function loadTracks() {
  const box = document.getElementById("storms");
  let data;
  try { data = await fetch("data/tracks.json", { cache: "no-cache" }).then(r => r.json()); }
  catch { box.innerHTML = '<p class="note">讀不到 data/tracks.json。用本機直接開檔時瀏覽器會擋，請用 GitHub Pages 或本機伺服器開啟。</p>'; return; }

  document.getElementById("updated").textContent = "資料更新：" + fmtTime(data.updated);
  if (!data.storms.length) { box.innerHTML = '<p class="note">目前沒有活躍的熱帶氣旋。</p>'; return; }

  box.innerHTML = "";
  const CAT_NAME = { official: "官方預報", nwp: "數值模式", ai: "AI 模式" };
  // 西北太平洋的颱風排前面，而且一進網頁只先顯示它們
  const basinOf = st => (st.basin || st.id.slice(0, 2)).toUpperCase();
  const storms = [...data.storms].sort((a, b) => (basinOf(a) !== CONFIG.defaultBasin) - (basinOf(b) !== CONFIG.defaultBasin));
  storms.forEach(storm => { try {
    const on = basinOf(storm) === CONFIG.defaultBasin;
    const keys = stormKeys[storm.id] = [];
    const wrap = document.createElement("div");
    wrap.className = "storm";
    wrap.innerHTML = `<label class="row storm-head"><input type="checkbox" ${on ? "checked" : ""} data-storm="${esc(storm.id)}">` +
      `<span class="storm-name">${esc(storm.name)}</span><span class="basin-tag">${esc(BASIN_NAME[basinOf(storm)] || basinOf(storm))}</span></label>`;
    const body = document.createElement("div");
    body.className = "storm-body";
    body.hidden = !on;
    wrap.appendChild(body);
    if (storm.demo) body.insertAdjacentHTML("beforeend", '<p class="note warn">這是虛構的示範路徑，接上真實資料來源後會自動替換。</p>');
    if (storm.best.length) {
      const bestKey = storm.id + ":best";
      trackLayers[bestKey] = drawBest(storm);
      keys.push(bestKey);
      body.insertAdjacentHTML("beforeend", `<label class="row"><input type="checkbox" checked data-key="${bestKey}"> 實測路徑</label>`);
    }

    const newest = Math.max(...storm.forecasts.map(f => Date.parse(f.init)));
    const fmtInit = iso => { const d = new Date(iso); return `${String(d.getUTCMonth() + 1).padStart(2, "0")}/${String(d.getUTCDate()).padStart(2, "0")} ${String(d.getUTCHours()).padStart(2, "0")}Z 起報`; };
    ["official", "nwp", "ai"].forEach(cat => {
      const ORDER = ["JTWC", "OFCL", "RJTD", "RCTP"];
      const rank = m => (ORDER.indexOf(m) + 1) || 99;
      const list = storm.forecasts.filter(f => f.category === cat).sort((a, b) => rank(a.model) - rank(b.model));
      if (!list.length) return;
      body.insertAdjacentHTML("beforeend", `<div class="cat">${CAT_NAME[cat]}</div>`);
      list.forEach((f, i) => {
        const color = CONFIG.modelColors[f.model] || CONFIG.palette[cat][i % CONFIG.palette[cat].length];
        f.tauLabels = cat === "official" && i === 0;   // 只在第一條官方路徑標 24h、48h…，避免文字重疊
        const key = `${storm.id}:${f.model}`;
        const stale = newest - Date.parse(f.init) >= 12 * 3600000;   // 比最新的預報早 12 小時以上
        trackLayers[key] = drawForecast(f, color);
        keys.push(key);
        body.insertAdjacentHTML("beforeend",
          `<label class="row model"><input type="checkbox" checked data-key="${key}"><span class="swatch ${cat}" style="border-top-color:${color}"></span>` +
          `<span class="model-text">${esc(f.label)}<span class="model-init${stale ? " stale" : ""}">${fmtInit(f.init)}${stale ? "（較舊）" : ""}</span></span>` +
          `<span class="model-code">${esc(f.model)}</span></label>`);
      });
    });

    // 系集成員：每個系集一個勾選框，預設不顯示（線很多）
    const ens = {};
    storm.forecasts.filter(f => f.category === "ens").forEach(f => (ens[f.group] ||= []).push(f));
    const groups = Object.keys(ens);
    if (groups.length) body.insertAdjacentHTML("beforeend", `<div class="cat">系集成員</div>`);
    groups.forEach((name, i) => {
      const color = CONFIG.groupColors[name] || CONFIG.palette.ens[i % CONFIG.palette.ens.length];
      const key = `${storm.id}:ens:${name}`;
      const g = L.layerGroup();
      ens[name].forEach(f => L.polyline(unwrap(f.points), { pane: "tracks", color, weight: 1, opacity: 0.55 })
        .bindTooltip(`<b>${esc(f.model)}</b>　${fmtInit(f.init)}`, { className: "tc-tip", sticky: true }).addTo(g));
      trackLayers[key] = g;
      keys.push(key);
      const init = ens[name].map(f => f.init).sort().pop();
      body.insertAdjacentHTML("beforeend",
        `<label class="row model"><input type="checkbox" data-key="${key}"><span class="swatch" style="border-top:1.5px solid ${color}"></span>` +
        `<span class="model-text">${esc(name)}<span class="model-init">${ens[name].length} 條・${fmtInit(init)}</span></span></label>`);
    });
    box.appendChild(wrap);
    if (on) syncStorm(storm.id);
  } catch (err) {   // 某個颱風的資料有問題時，顯示錯誤訊息，不影響其他颱風
    console.error(err);
    box.insertAdjacentHTML("beforeend", `<p class="note warn">顯示 ${esc(storm.id)} 時出錯：${esc(err.message)}</p>`);
  } });
  // 把畫面移到所有颱風路徑的範圍
  const all = L.featureGroup(Object.values(trackLayers).filter(g => map.hasLayer(g)).flatMap(g => g.getLayers()));
  if (all.getLayers().length) map.fitBounds(all.getBounds(), { paddingTopLeft: [innerWidth > 720 ? 330 : 20, 20], paddingBottomRight: [20, 90] });
  box.addEventListener("change", e => {
    const sid = e.target.dataset.storm;
    if (sid !== undefined) {   // 颱風的總開關：收合／展開，並一次開關它所有的路徑
      e.target.closest(".storm").querySelector(".storm-body").hidden = !e.target.checked;
      syncStorm(sid);
      return;
    }
    const wrap = e.target.closest(".storm");
    if (wrap) syncStorm(wrap.querySelector("[data-storm]").dataset.storm);
  });
}

/* ---------- 播放控制 ---------- */
function setFrame(i) { frame = i; slider.value = i; showClock(); showSatFrame(); if (radarLayer) showRadar(); }
slider.addEventListener("input", e => setFrame(+e.target.value));
const playBtn = document.getElementById("play");
let preparing = false;
playBtn.addEventListener("click", () => {
  if (preparing) return;
  if (timer) {
    clearInterval(timer); timer = null; pruneSat();
    playBtn.textContent = "▶"; playBtn.setAttribute("aria-label", "播放動畫"); return;
  }
  if (satMode === "off") return;
  // 先把所有時間的圖下載好（最多等 15 秒），再開始播放
  preparing = true; playBtn.textContent = "…"; playBtn.setAttribute("aria-label", "載入動畫中");
  const groups = times.map((_, i) => { const g = satGroup(i); if (!map.hasLayer(g)) g.addTo(map); return g; });
  let left = groups.length, started = false;
  const start = () => {
    if (started) return; started = true; preparing = false;
    playBtn.textContent = "❚❚"; playBtn.setAttribute("aria-label", "暫停動畫");
    timer = setInterval(() => setFrame((frame + 1) % CONFIG.frames), 700);
  };
  groups.forEach(g => whenLoaded(g, () => --left === 0 && start()));
  setTimeout(start, 15000);
});

/* ---------- 手機版面板開關 ---------- */
const panel = document.getElementById("panel"), tp = document.getElementById("togglePanel");
tp.addEventListener("click", () => { const o = panel.classList.toggle("open"); tp.setAttribute("aria-expanded", o); tp.textContent = o ? "收起" : "圖層"; });

showClock(); buildSat(true); drawGrid(); loadTracks();
</script>
</body>
</html>
