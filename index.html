<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>熱帶氣旋觀測站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --panel: rgba(244, 247, 249, .94);
    --panel-solid: #f4f7f9;
    --ink: #13283a;
    --ink-soft: #4d6273;
    --rule: #c9d5de;
    --accent: #0b6e8a;      /* 海水藍：互動元件 */
    --warn: #c4471d;        /* 警示橘：目前時間、示範資料提醒 */
    --shadow: 0 6px 24px rgba(10, 30, 45, .25);
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
    --num: "Barlow Semi Condensed", "Arial Narrow", var(--sans);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(15, 37, 53, .92);
      --panel-solid: #0f2535;
      --ink: #e4edf2;
      --ink-soft: #9db2c0;
      --rule: #2a4558;
      --accent: #5cc4dd;
      --warn: #ff9a6b;
      --shadow: 0 6px 24px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(15, 37, 53, .92); --panel-solid: #0f2535; --ink: #e4edf2; --ink-soft: #9db2c0;
    --rule: #2a4558; --accent: #5cc4dd; --warn: #ff9a6b; --shadow: 0 6px 24px rgba(0,0,0,.45); color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0e2232; font-family: var(--sans); color: var(--ink); font-size: 15px; }
  #map { position: fixed; inset: 0; background: #0e2232; }

  /* 左側控制面板 */
  .panel {
    position: fixed; z-index: 1000;
    top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px;
    width: 300px; max-height: calc(100% - 140px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; background: var(--panel); backdrop-filter: blur(8px);
    border-radius: 10px; box-shadow: var(--shadow); padding: 16px 16px 8px;
  }
  .panel h1 { font-size: 19px; font-weight: 700; margin: 0 0 2px; letter-spacing: .02em; }
  .updated { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .group { border-top: 1px solid var(--rule); padding: 12px 0; }
  .group h2 { font-size: 14px; font-weight: 700; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; cursor: pointer; }
  .row input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
  .note { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; margin: 6px 0 0; }
  .note.warn { color: var(--warn); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 13px; padding: 6px 0; border: 0; background: transparent; color: var(--ink); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel-solid); font-weight: 500; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .sharp-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12.5px; color: var(--ink-soft); }
  .seg.seg2 { grid-template-columns: repeat(2, 1fr); width: 120px; }
  .seg.seg-wide { width: 150px; }
  label.slider { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }

  .storm-name { font-weight: 700; font-size: 14.5px; }
  .storm { border-top: 1px dashed var(--rule); padding: 6px 0 2px; }
  .storm:first-child { border-top: 0; }
  .storm-head { padding: 4px 0; }
  .basin-tag { margin-left: auto; font-size: 12px; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .storm-body { padding-left: 24px; }
  .cat { font-size: 12.5px; color: var(--ink-soft); margin: 8px 0 2px; }
  .swatch { width: 22px; height: 0; border-top: 3px solid; flex: none; }
  .swatch.nwp { border-top-style: dashed; }
  .swatch.ai { border-top-style: dotted; border-top-width: 4px; }
  .model-code { margin-left: auto; font-family: var(--num); color: var(--ink-soft); font-size: 13px; }
  .row.model { align-items: flex-start; }
  .row.model input, .row.model .swatch { margin-top: 4px; }
  .row.model .swatch { margin-top: 9px; }
  .model-text { display: flex; flex-direction: column; line-height: 1.3; }
  .model-init { font-size: 12px; color: var(--ink-soft); font-family: var(--num); letter-spacing: .02em; }
  .model-init.stale { color: var(--warn); }
  .pixelated img { image-rendering: pixelated; }
  .obs-icon { background: none; border: 0; }
  .obs-icon svg { overflow: visible; display: block; }
  .grid-label { font-family: var(--num); font-size: 12px; font-weight: 500; color: rgba(255,255,255,.75); text-shadow: 0 0 3px #000; white-space: nowrap; }
  .intensity { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 6px; }
  .intensity span { font-size: 11px; text-align: center; padding: 2px 0; border-radius: 3px; color: #10202c; }

  .toggle-panel { display: none; }

  /* 底部時間列：整個網站最醒目的元素 */
  /* 左下角：滑鼠所在位置的經緯度，與底部時間列等高對齊 */
  .coords {
    position: fixed; z-index: 1000; left: 12px; width: 300px; min-height: 60px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); border-radius: 10px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 14px; padding: 8px 16px;
  }
  .coords .vals { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .coords .sub { font-size: 13.5px; color: var(--ink); white-space: nowrap; }
  .coords .sub b { font-family: var(--num); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .coords .sub .k { color: var(--ink-soft); margin-right: 4px; }
  .coords .sub .sep { color: var(--rule); margin: 0 8px; }
  .coords .lbl { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
  .coords .val { font-family: var(--num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .01em; white-space: nowrap; }
  .coords .val.idle { color: var(--ink-soft); font-weight: 500; font-family: var(--sans); font-size: 15px; }
  /* 點測站後出現在時間列上方的折線圖 */
  .chartbox {
    position: fixed; z-index: 1001; left: 324px; right: 12px; height: 240px;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); border-radius: 10px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; padding: 10px 14px 8px;
  }
  .chartbox[hidden] { display: none; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
  .chart-head span { color: var(--ink-soft); font-size: 12.5px; }
  .chart-close { font: inherit; border: 0; background: transparent; color: var(--ink-soft); font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  .chart-close:hover { color: var(--ink); background: var(--rule); }
  .chart-wrap { position: relative; flex: 1; min-height: 0; }
  .chart-wrap .note { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; text-align: center; pointer-events: none; }
  .chart-wrap .note:empty { display: none; }
  .timebar {
    position: fixed; z-index: 1000; left: 324px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); backdrop-filter: blur(8px); border-radius: 10px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 14px; padding: 10px 16px;
  }
  .play {
    width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--panel-solid);
    font-size: 15px; cursor: pointer;
  }
  .clock { font-family: var(--num); line-height: 1.05; min-width: 150px; }
  .clock .utc { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .clock .local { font-size: 13px; color: var(--ink-soft); font-family: var(--sans); }
  .timebar input { margin: 0; }

  button:focus-visible, input:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }

  .leaflet-tooltip.tc-tip {
    font-family: var(--sans); font-size: 12.5px; background: var(--panel-solid); color: var(--ink);
    border: 1px solid var(--rule); box-shadow: var(--shadow);
  }
  .tau-label { font-family: var(--num); font-size: 12px; font-weight: 600; color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: nowrap; }
  .leaflet-control-attribution { font-size: 10.5px; }

  @media (max-width: 720px) {
    .coords { top: calc(12px + env(safe-area-inset-top, 0px)); bottom: auto; left: 8px; width: auto; min-height: 38px; padding: 4px 12px; gap: 8px; }
    .coords .val { font-size: 16px; }
    .panel { top: auto; left: 0; right: 0; width: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px));
             max-height: 55%; border-radius: 12px 12px 0 0; transform: translateY(calc(100% + 80px)); transition: transform .25s; }
    .panel.open { transform: none; }
    .toggle-panel {
      display: block; position: fixed; z-index: 1001; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
      font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; border: 0;
      background: var(--panel-solid); color: var(--ink); box-shadow: var(--shadow);
    }
    .timebar { left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); gap: 10px; padding: 8px 12px; }
    .clock { min-width: 118px; } .clock .utc { font-size: 21px; }
    .leaflet-control-zoom { display: none; }
    .chartbox { left: 8px; right: 8px; height: 220px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<div id="map" aria-label="地圖"></div>

<button class="toggle-panel" id="togglePanel" aria-expanded="false" aria-controls="panel">圖層</button>

<aside class="panel" id="panel">
  <h1>熱帶氣旋觀測站</h1>
  <p class="updated" id="updated">讀取資料中…</p>

  <section class="group">
    <h2>衛星雲圖</h2>
    <div class="seg" role="group" aria-label="衛星頻道">
      <button data-sat="ir" aria-pressed="true">紅外線</button>
      <button data-sat="airmass" aria-pressed="false">空氣團</button>
      <button data-sat="vis" aria-pressed="false">可見光</button>
      <button data-sat="off" aria-pressed="false">關閉</button>
    </div>
    <label class="slider">透明度<input type="range" id="satOpacity" min="0.2" max="1" step="0.05" value="0.85"></label>
    <div class="sharp-row">資料來源
      <div class="seg seg2 seg-wide" role="group" aria-label="衛星資料來源">
        <button data-src="gibs" aria-pressed="true">NASA</button>
        <button data-src="jma" aria-pressed="false">氣象廳</button>
      </div>
    </div>
    <div class="sharp-row">放大後顯示
      <div class="seg seg2" role="group" aria-label="放大後的顯示方式">
        <button data-sharp="pixel" aria-pressed="true">像素</button>
        <button data-sharp="smooth" aria-pressed="false">平滑</button>
      </div>
    </div>
    <p class="note" id="satNote"></p>
  </section>

  <section class="group">
    <h2>疊加圖層</h2>
    <label class="row"><input type="checkbox" id="radarToggle"> 雷達回波（RainViewer）</label>
    <label class="row"><input type="checkbox" id="sstToggle"> 海溫（GHRSST MUR，前一日）</label>
    <label class="row"><input type="checkbox" id="gridToggle" checked> 經緯線</label>
    <label class="row"><input type="checkbox" id="obsToggle" checked> 測站風標（中央氣象署、日本氣象廳）</label>
    <p class="note" id="obsNote"></p>
  </section>

  <section class="group" id="trackGroup">
    <h2>路徑預報</h2>
    <div id="storms"><p class="note">讀取中…</p></div>
    <div class="cat">最佳路徑強度（節）</div>
    <div class="intensity" id="intensityLegend"></div>
  </section>
</aside>

<div class="coords">
  <span class="lbl">游標<br>位置</span>
  <span class="vals">
    <span class="val idle" id="coordVal">移到地圖上</span>
    <span class="sub" id="coordSub" hidden></span>
  </span>
</div>

<section class="chartbox" id="chartbox" hidden aria-label="測站過去 24 小時觀測">
  <div class="chart-head">
    <div><b id="chartTitle"></b> <span id="chartSub"></span></div>
    <button class="chart-close" id="chartClose" aria-label="關閉圖表">✕</button>
  </div>
  <div class="chart-wrap"><canvas id="chartCanvas"></canvas><p class="note" id="chartMsg"></p></div>
</section>

<div class="timebar" role="group" aria-label="衛星時間">
  <button class="play" id="play" aria-label="播放動畫">▶</button>
  <div class="clock"><div class="utc" id="clockUtc">--</div><div class="local" id="clockLocal"></div></div>
  <input type="range" id="timeSlider" min="0" max="11" step="1" value="11" aria-label="選擇時間">
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ===================== 設定區：想調整的東西大多在這裡 ===================== */
const CONFIG = {
  center: [20, 135], zoom: 4,
  frames: 12,          // 動畫張數
  stepMin: 20,         // 每張相隔幾分鐘
  latencyMin: 60,      // 查不到最新時間時，假設資料延遲幾分鐘
  satSource: "gibs",   // 預設衛星來源："gibs"（NASA，較清晰）或 "jma"（氣象廳，較即時）
  // 氣象廳向日葵全圓盤圖磚（僅涵蓋向日葵視野，最高縮放 5，約 4～5 公里一格）
  jma: {
    level: 5,
    products: { ir: { label: "紅外線", path: "B13/TBB" }, airmass: { label: "水氣", path: "B08/TBB" }, vis: { label: "可見光", path: "B03/ALBD" } },
  },
  // NASA GIBS 圖層名稱（可到 NASA Worldview 查更多）
  // 每顆衛星的星下點經度：畫面離衛星太遠時就不下載那顆衛星的圖，節省流量
  satLon: { "GOES-West": -137.2, "GOES-East": -75.2, "Himawari": 140.7 },
  sat: {
    ir:      { level: 6, layers: ["GOES-West_ABI_Band13_Clean_Infrared", "GOES-East_ABI_Band13_Clean_Infrared", "Himawari_AHI_Band13_Clean_Infrared"] },
    airmass: { level: 6, layers: ["GOES-West_ABI_Air_Mass", "GOES-East_ABI_Air_Mass", "Himawari_AHI_Air_Mass"] },
    vis:     { level: 7, layers: ["GOES-West_ABI_Band2_Red_Visible_1km", "GOES-East_ABI_Band2_Red_Visible_1km", "Himawari_AHI_Band3_Red_Visible_1km"] },
  },
  sstLayer: "GHRSST_L4_MUR_Sea_Surface_Temperature",
  // 海陸邊界線：顏色與粗細可自行調整
  coast: {
    color: "#f2d14b",
    weight: 1,
    detailZoom: 5,     // 放大到這個等級以上，改用精細海岸線
  },
  grid: { color: "#ffffff", opacity: 0.35 },
  defaultBasin: "WP",   // 一進網頁只先顯示這個海域的颱風（WP = 西北太平洋）
  // 路徑顏色：官方用白色實線，數值模式用冷色虛線，AI 模式用暖色點線
  palette: {
    official: ["#ffffff", "#ffe066"],
    nwp: ["#4cc9f0", "#4895ef", "#80ed99", "#56cfe1", "#a0c4ff", "#72efdd", "#b8f2e6"],
    ai: ["#ff70a6", "#ff9770", "#ffd670", "#e980fc"],
    ens: ["#8fd3ff", "#b5f5c4", "#d4c2ff", "#a0c4ff", "#c7f9cc"],   // 系集成員：細線、半透明
  },
  // 指定特定來源的顏色（優先於上面的 palette）
  modelColors: {
    JTWC: "#ffffff", OFCL: "#ffffff", RJTD: "#ff6b6b", RCTP: "#ffd23f", VHHH: "#7ee0a1",
    ECMF: "#4895ef", EEMN: "#90c2ff", AIFS: "#ff70a6", AIEMN: "#ffa3c7",
  },
  groupColors: { "ECMWF 系集成員": "#90c2ff", "AIFS 系集成員": "#ffa3c7" },
};
/* ======================================================================== */

const GIBS = "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best";
const map = L.map("map", { worldCopyJump: true, minZoom: 2, maxZoom: 9, zoomControl: false })
  .setView(CONFIG.center, CONFIG.zoom);
L.control.zoom({ position: "topright" }).addTo(map);

// 只畫海陸邊界線（Natural Earth 1:5000 萬海岸線，公有領域資料）
map.attributionControl.setPrefix(false).addAttribution(
  '海岸線：<a href="https://www.naturalearthdata.com/">Natural Earth</a> · 衛星與海溫：<a href="https://earthdata.nasa.gov/gibs">NASA GIBS</a>、<a href="https://www.jma.go.jp/">気象庁</a>' +
  ' · 路徑：<a href="https://www.jma.go.jp/">気象庁</a>、<a href="https://www.cwa.gov.tw/">中央氣象署</a>、JTWC、NCAR TCGP、' +
  'Based on data and products of <a href="https://www.ecmwf.int/">ECMWF</a> (CC BY 4.0)');
map.createPane("coast").style.zIndex = 450;   // 在雲圖、雷達之上，路徑之下
map.getPane("coast").style.pointerEvents = "none";
const coastRenderer = L.canvas({ pane: "coast" });
const coastStyle = () => ({ renderer: coastRenderer, interactive: false, color: CONFIG.coast.color, weight: CONFIG.coast.weight, opacity: 0.9 });
const toLatLngs = (lines, offset) => lines.map(l => l.map(([x, y]) => [y, x + offset]));

// 縮小時：整份 1:5000 萬海岸線，左右各多畫一份，跨越換日線才不會斷
const coarseCoast = L.layerGroup();
fetch("data/coast_50m.json").then(r => r.json()).then(lines => {
  [-360, 0, 360].forEach(off => L.polyline(toLatLngs(lines, off), coastStyle()).addTo(coarseCoast));
  updateCoast();
}).catch(() => console.warn("海岸線載入失敗：請確認 data/coast_50m.json 存在"));

// 放大時：1:1000 萬精細海岸線，切成 10°×10° 小塊，只下載畫面範圍內的
const fineCoast = L.layerGroup(), fineCache = {}, fineShown = {};
let fineIndex = null;
fetch("data/coast10/index.json").then(r => r.json()).then(list => { fineIndex = new Set(list); updateCoast(); }).catch(() => {});

function updateCoast() {
  const fine = map.getZoom() >= CONFIG.coast.detailZoom && fineIndex;
  if (fine) { map.removeLayer(coarseCoast); fineCoast.addTo(map); }
  else { map.removeLayer(fineCoast); coarseCoast.addTo(map); return; }
  const b = map.getBounds().pad(0.3);
  const want = new Set();
  for (let lat = Math.floor(b.getSouth() / 10) * 10; lat < b.getNorth(); lat += 10) {
    for (let lonU = Math.floor(b.getWest() / 10) * 10; lonU < b.getEast(); lonU += 10) {
      const off = Math.floor((lonU + 180) / 360) * 360;
      const key = `${lat}_${lonU - off}`;
      if (fineIndex.has(key)) want.add(`${key}@${off}`);
    }
  }
  Object.keys(fineShown).forEach(k => { if (!want.has(k)) { fineCoast.removeLayer(fineShown[k]); delete fineShown[k]; } });
  want.forEach(k => {
    if (fineShown[k]) return;
    const [key, off] = k.split("@");
    fineShown[k] = L.layerGroup().addTo(fineCoast);
    (fineCache[key] ||= fetch(`data/coast10/${key}.json`).then(r => r.json()))
      .then(lines => fineShown[k] && L.polyline(toLatLngs(lines, +off), coastStyle()).addTo(fineShown[k]));
  });
}
map.on("moveend", updateCoast);

/* ---------- 經緯線：依縮放等級調整間距，最密 1° ---------- */
map.createPane("grid").style.zIndex = 440;
map.getPane("grid").style.pointerEvents = "none";
const gridLayer = L.layerGroup(), gridRenderer = L.canvas({ pane: "grid" });
const gridStep = z => z <= 2 ? 30 : z <= 3 ? 20 : z <= 4 ? 10 : z <= 5 ? 5 : z <= 6 ? 2 : 1;
const fmtLat = v => v === 0 ? "0°" : `${Math.abs(v)}°${v > 0 ? "N" : "S"}`;
const fmtLon = v => { const n = ((v + 180) % 360 + 360) % 360 - 180; return n === 0 || n === -180 ? (n ? "180°" : "0°") : `${Math.abs(n)}°${n > 0 ? "E" : "W"}`; };
function drawGrid() {
  gridLayer.clearLayers();
  if (!document.getElementById("gridToggle").checked) return;
  const v = map.getBounds(), b = v.pad(0.2), st = gridStep(map.getZoom());
  const style = { renderer: gridRenderer, interactive: false, color: CONFIG.grid.color, opacity: CONFIG.grid.opacity, weight: 0.8 };
  const lat0 = Math.max(-80, Math.ceil(b.getSouth() / st) * st), lat1 = Math.min(80, Math.floor(b.getNorth() / st) * st);
  const lon0 = Math.ceil(b.getWest() / st) * st, lon1 = Math.floor(b.getEast() / st) * st;
  const label = (ll, text, anchor) => L.marker(ll, { pane: "grid", interactive: false, keyboard: false,
    icon: L.divIcon({ className: "grid-label", html: text, iconSize: null, iconAnchor: anchor }) }).addTo(gridLayer);
  for (let lat = lat0; lat <= lat1; lat += st) {
    L.polyline([[lat, b.getWest()], [lat, b.getEast()]], style).addTo(gridLayer);
    if (lat > v.getSouth() && lat < v.getNorth()) label([lat, v.getEast()], fmtLat(lat), [44, 7]);   // 緯度標在右緣
  }
  for (let lon = lon0; lon <= lon1; lon += st) {
    L.polyline([[Math.max(-85, b.getSouth()), lon], [Math.min(85, b.getNorth()), lon]], style).addTo(gridLayer);
    if (lon > v.getWest() && lon < v.getEast()) label([v.getNorth(), lon], fmtLon(lon), [-3, -4]);    // 經度標在上緣
  }
}
gridLayer.addTo(map);
map.on("moveend", drawGrid);
document.getElementById("gridToggle").addEventListener("change", drawGrid);

/* ---------- 時間軸 ---------- */
function floor10(t) {
  const d = new Date(t);
  d.setUTCSeconds(0, 0);
  d.setUTCMinutes(d.getUTCMinutes() - (d.getUTCMinutes() % 10));
  return d;
}
const makeTimes = t0 => Array.from({ length: CONFIG.frames }, (_, i) =>
  new Date(t0.getTime() - (CONFIG.frames - 1 - i) * CONFIG.stepMin * 60000));
let times = makeTimes(floor10(Date.now() - CONFIG.latencyMin * 60000));
const gibsTime = d => d.toISOString().slice(0, 19) + "Z";
const jmaTime = d => d.toISOString().slice(0, 19).replace(/[-:T]/g, "");   // 20261022071000

// 向 NASA GIBS 查詢某圖層目前最新的一張是幾點（DescribeDomains）
async function latestGibs() {
  const layer = CONFIG.sat[satMode === "off" ? "ir" : satMode].layers.find(n => n.startsWith("Himawari")) || CONFIG.sat.ir.layers[0];
  const lvl = CONFIG.sat[satMode === "off" ? "ir" : satMode].level;
  const end = new Date(), start = new Date(end - 2 * 86400000);
  const url = `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/wmts.cgi?SERVICE=WMTS&REQUEST=DescribeDomains&VERSION=1.0.0` +
    `&LAYER=${layer}&TILEMATRIXSET=GoogleMapsCompatible_Level${lvl}&TIME=${gibsTime(start)}/${gibsTime(end)}`;
  const xml = await fetch(url).then(r => r.text());
  const dom = [...xml.matchAll(/<Domain>([^<]*T[^<]*)<\/Domain>/g)].pop();
  const last = dom[1].trim().split(",").pop().split("/");
  return floor10(Date.parse(last[1] || last[0]));
}
// 氣象廳：先讀官方時間清單；讀不到時，逐一試載最近幾個時間的圖磚
async function latestJma() {
  try {
    const list = await fetch("https://www.jma.go.jp/bosai/himawari/data/satimg/targetTimes_fd.json").then(r => r.json());
    const v = list.map(x => x.validtime).sort().pop();
    return new Date(Date.UTC(+v.slice(0, 4), +v.slice(4, 6) - 1, +v.slice(6, 8), +v.slice(8, 10), +v.slice(10, 12)));
  } catch {
    const now = floor10(Date.now());
    for (let k = 1; k <= 9; k++) {
      const t = new Date(now - k * 600000);
      const ok = await new Promise(res => {
        const img = new Image();
        img.onload = () => res(true); img.onerror = () => res(false);
        img.src = `https://www.jma.go.jp/bosai/himawari/data/satimg/${jmaTime(t)}/fd/${jmaTime(t)}/B13/TBB/2/3/1.jpg`;
      });
      if (ok) return t;
    }
    throw new Error("找不到氣象廳最新衛星圖");
  }
}
// 更新時間軸到最新一張（播放中不更新，避免畫面跳動）
async function refreshLatest() {
  if (timer) return;
  let t;
  try { t = satSource === "jma" ? await latestJma() : await latestGibs(); }
  catch { t = floor10(Date.now() - CONFIG.latencyMin * 60000); }
  if (t.getTime() === times[times.length - 1].getTime()) return;
  const atEnd = frame === CONFIG.frames - 1;
  times = makeTimes(t);
  if (atEnd) { frame = CONFIG.frames - 1; slider.value = frame; }
  showClock(); buildSat(true);
}
setInterval(refreshLatest, 5 * 60000);   // 每 5 分鐘檢查一次有沒有新的衛星圖
let frame = CONFIG.frames - 1;

const slider = document.getElementById("timeSlider");
slider.max = CONFIG.frames - 1; slider.value = frame;

function showClock() {
  const d = times[frame];
  document.getElementById("clockUtc").textContent =
    `${String(d.getUTCMonth() + 1).padStart(2, "0")}/${String(d.getUTCDate()).padStart(2, "0")} ${d.toISOString().slice(11, 16)} UTC`;
  document.getElementById("clockLocal").textContent =
    "本地 " + d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
}

/* ---------- 衛星雲圖 ----------
   載入策略：平常只下載「目前這一張」；按下播放才下載其餘時間的圖。
   而且只下載畫面看得到的衛星（例如看西太平洋時不抓 GOES-East）。 */
let satMode = "ir", satOpacity = 0.85, satGroups = [], satKey = "", timer = null, satSource = CONFIG.satSource;
const satLevel = () => satSource === "jma" ? CONFIG.jma.level : CONFIG.sat[satMode].level;
map.createPane("sat").style.zIndex = 250;

function activeSatLayers() {
  if (satMode === "off") return [];
  const b = map.getBounds(), w = b.getWest(), e = b.getEast();
  const names = satSource === "jma" ? ["Himawari_JMA"] : CONFIG.sat[satMode].layers;
  return names.filter(name => {
    const sub = CONFIG.satLon[name.split("_")[0]];
    if (sub === undefined || e - w >= 300) return true;
    for (let lon = w; lon <= e + 5; lon += 5) {
      if (Math.abs((((lon - sub) % 360) + 540) % 360 - 180) < 80) return true;
    }
    return false;
  });
}
function satGroup(i) {
  if (!satGroups[i]) {
    const level = satLevel();
    satGroups[i] = L.layerGroup(activeSatLayers().map(name => satSource === "jma"
      ? L.tileLayer(`https://www.jma.go.jp/bosai/himawari/data/satimg/${jmaTime(times[i])}/fd/${jmaTime(times[i])}/${CONFIG.jma.products[satMode].path}/{z}/{x}/{y}.jpg`, {
          pane: "sat", maxNativeZoom: level, maxZoom: 9, opacity: 0, bounds: [[-81, 60], [81, 222]],
        })
      : L.tileLayer(`${GIBS}/${name}/default/${gibsTime(times[i])}/GoogleMapsCompatible_Level${level}/{z}/{y}/{x}.png`, {
          pane: "sat", maxNativeZoom: level, maxZoom: 9, opacity: 0, bounds: [[-85, -180], [85, 180]],
        })));
  }
  return satGroups[i];
}
function whenLoaded(group, cb) {
  const ls = group.getLayers(); let n = 0;
  if (!ls.length) return cb();
  ls.forEach(l => (l.isLoading() ? l.once("load", () => ++n === ls.length && cb()) : ++n === ls.length && cb()));
}
function pruneSat() {   // 沒在播放時，把其他時間的圖層拿掉，平移縮放就不會重複下載
  if (timer) return;
  satGroups.forEach((g, i) => { if (g && i !== frame && map.hasLayer(g)) map.removeLayer(g); });
}
// 放大超過衛星原始解析度時，用「像素清晰」方式放大，不做模糊內插，看得出真實的雲頂細節
// 「平滑」則讓瀏覽器內插，邊緣柔和但細節看起來較糊；兩者的資料解析度相同
let sharpMode = "pixel";
function updateSatSharpness() {
  const lv = satMode === "off" ? 99 : satLevel();
  map.getPane("sat").classList.toggle("pixelated", sharpMode === "pixel" && map.getZoom() > lv);
}
document.querySelectorAll("[data-sharp]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-sharp]").forEach(x => x.setAttribute("aria-pressed", x === b));
  sharpMode = b.dataset.sharp; updateSatSharpness();
}));
map.on("zoomend", updateSatSharpness);

function showSatFrame() {
  updateSatSharpness();
  if (satMode === "off") return;
  const g = satGroup(frame);
  if (!map.hasLayer(g)) g.addTo(map);
  g.eachLayer(l => l.setOpacity(satOpacity));
  satGroups.forEach((o, i) => { if (o && i !== frame) o.eachLayer(l => l.setOpacity(0)); });
  whenLoaded(g, pruneSat);   // 新的一張載完才移除舊的，避免閃一下空白
}
function buildSat(force) {
  const key = satSource + ":" + satMode + ":" + activeSatLayers().join(",") + ":" + gibsTime(times[0]);
  if (!force && key === satKey) return;
  satKey = key;
  satGroups.forEach(g => g && map.removeLayer(g));
  satGroups = [];
  if (timer) times.forEach((_, i) => satGroup(i).addTo(map));
  showSatFrame();
}
map.on("moveend", () => buildSat());

document.querySelectorAll("[data-sat]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-sat]").forEach(x => x.setAttribute("aria-pressed", x === b));
  satMode = b.dataset.sat; buildSat(true);
}));
document.getElementById("satOpacity").addEventListener("input", e => { satOpacity = +e.target.value; showSatFrame(); });

// 切換資料來源：按鈕文字、說明與時間軸都跟著換
const SAT_NOTE = {
  gibs: "NASA GIBS：GOES 東／西與向日葵衛星。紅外線約 2 公里、可見光約 1 公里，比較清晰，但通常比實際時間晚 30～60 分鐘。印度洋與非洲上空沒有涵蓋。",
  jma: "日本氣象廳：只有向日葵衛星（西北太平洋與澳洲一帶）。通常只比實際時間晚 10～20 分鐘，但圖磚較粗，約 4～5 公里一格。",
};
function applySource() {

  document.querySelector('[data-sat="airmass"]').textContent = satSource === "jma" ? CONFIG.jma.products.airmass.label : "空氣團";
  document.getElementById("satNote").textContent = SAT_NOTE[satSource];
}
document.querySelectorAll("[data-src]").forEach(b => b.addEventListener("click", () => {

  satSource = b.dataset.src; applySource(); buildSat(true); refreshLatest();
}));
applySource();

/* ---------- 雷達（RainViewer 免費版：最高縮放 7、僅過去資料、個人／教育用途） ---------- */

map.createPane("radar").style.zIndex = 300;
async function loadRadar() {

/* ---------- 路徑預報 ---------- */
const KT_SCALE = [ // [下限, 顏色, 標籤]，參考薩菲爾－辛普森等級
  [0, "#7fb3d5", "<34"], [34, "#7ee0a1", "34"], [64, "#ffe066", "64"],
  [83, "#ffb347", "83"], [96, "#ff6b6b", "96"], [113, "#d65db1", "113"],
  [137, "#4b1d7a", "137+", "#ffffff"],   // 第 4 個值是文字顏色（深底配白字）
];
const ktColor = kt => (KT_SCALE.filter(s => (kt ?? 0) >= s[0]).pop() || KT_SCALE[0])[1];
document.getElementById("intensityLegend").innerHTML =
  KT_SCALE.map(([, c, t, fg]) => `<span style="background:${c}${fg ? `;color:${fg}` : ""}">${t}</span>`).join("");

// 讓跨越國際換日線的路徑連續，不會繞地球一圈
function unwrap(pts) {
  let prev = null;
  return pts.map(p => {
    let lon = p.lon;
    if (prev !== null) { while (lon - prev > 180) lon -= 360; while (prev - lon > 180) lon += 360; }
    prev = lon; return [p.lat, lon];
  });
}
const fmtTime = iso => {
  const d = new Date(iso);
  return `${d.toISOString().slice(5, 16).replace("T", " ")} UTC（本地 ${d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false })}）`;
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

map.createPane("tracks").style.zIndex = 500;
const trackLayers = {};  // key -> layerGroup

function drawForecast(f, color) {
  const g = L.layerGroup();
  const ll = unwrap(f.points);
  const style = { official: { weight: 3.5, dashArray: null }, nwp: { weight: 2, dashArray: "7 5" }, ai: { weight: 2.5, dashArray: "1 6", lineCap: "round" } }[f.category];
  L.polyline(ll, { pane: "tracks", color, opacity: .95, ...style }).addTo(g);
  f.points.forEach((p, i) => {
    const valid = new Date(new Date(f.init).getTime() + p.tau * 3600000).toISOString();
    const m = L.circleMarker(ll[i], { pane: "tracks", radius: f.category === "official" ? 4 : 2.5, color, fillColor: color, fillOpacity: 1, weight: 1 })
      .bindTooltip(`<b>${esc(f.label)}</b>　+${p.tau} 小時<br>${fmtTime(valid)}${p.vmax ? `<br>最大風速 ${p.vmax} 節` : ""}${p.mslp ? `　${p.mslp} hPa` : ""}`, { className: "tc-tip" });
    m.addTo(g);
    if (f.tauLabels && p.tau > 0 && p.tau % 24 === 0) {
      L.marker(ll[i], { pane: "tracks", interactive: false, icon: L.divIcon({ className: "tau-label", html: `${p.tau}h`, iconAnchor: [-6, 8] }) }).addTo(g);
    }
  });
  return g;
}

function drawBest(storm) {
  const g = L.layerGroup();
  const ll = unwrap(storm.best);
  L.polyline(ll, { pane: "tracks", color: "#ffffff", weight: 1.5, opacity: .7 }).addTo(g);
  storm.best.forEach((p, i) => L.circleMarker(ll[i], { pane: "tracks", radius: 5, color: "#10202c", weight: 1, fillColor: ktColor(p.vmax), fillOpacity: 1 })
    .bindTooltip(`<b>${esc(storm.name)}</b><br>${fmtTime(p.time)}<br>最大風速 ${p.vmax ?? "—"} 節${p.mslp ? `　${p.mslp} hPa` : ""}`, { className: "tc-tip" })
    .addTo(g));
  return g;
}

const BASIN_NAME = { WP: "西北太平洋", EP: "東太平洋", CP: "中太平洋", AL: "大西洋", IO: "北印度洋", SH: "南半球" };
const stormKeys = {};
// 依勾選狀態把某個颱風的路徑加到地圖或移除：颱風總開關與個別路徑都勾選才顯示
function syncStorm(sid) {
  const box = document.getElementById("storms");
  const head = [...box.querySelectorAll("[data-storm]")].find(x => x.dataset.storm === sid);
  (stormKeys[sid] || []).forEach(k => {
    const cb = [...box.querySelectorAll("[data-key]")].find(x => x.dataset.key === k);
    const l = trackLayers[k];
    if (!l) return;
    if (head && head.checked && cb && cb.checked) l.addTo(map); else map.removeLayer(l);
  });
}

// 第一次載入時把畫面移到颱風範圍；之後自動更新時保留使用者的畫面位置和勾選狀態
let tracksUpdated = null, tracksFirst = true;
async function loadTracks() {
  const box = document.getElementById("storms");
  let data;
  try { data = await fetch("data/tracks.json", { cache: "no-cache" }).then(r => r.json()); }
  catch {
    if (tracksFirst) box.innerHTML = '<p class="note">讀不到 data/tracks.json。用本機直接開檔時瀏覽器會擋，請用 GitHub Pages 或本機伺服器開啟。</p>';
    return;
  }
  if (data.updated === tracksUpdated) return;   // 資料沒有變，不必重畫
  tracksUpdated = data.updated;

  // 記下目前每個勾選框的狀態，重畫後套回去
  const prev = {};
  box.querySelectorAll("[data-key],[data-storm]").forEach(cb => { prev[cb.dataset.key || "S:" + cb.dataset.storm] = cb.checked; });
  const panelScroll = document.getElementById("panel").scrollTop;
  Object.values(trackLayers).forEach(l => map.removeLayer(l));
  Object.keys(trackLayers).forEach(k => delete trackLayers[k]);
  Object.keys(stormKeys).forEach(k => delete stormKeys[k]);

  document.getElementById("updated").textContent = "資料更新：" + fmtTime(data.updated);
  if (!data.storms.length) { box.innerHTML = '<p class="note">目前沒有活躍的熱帶氣旋。</p>'; tracksFirst = false; return; }

  box.innerHTML = "";
  const CAT_NAME = { official: "官方預報", nwp: "數值模式", ai: "AI 模式" };
  // 西北太平洋的颱風排前面，而且一進網頁只先顯示它們
  const basinOf = st => (st.basin || st.id.slice(0, 2)).toUpperCase();
  const storms = [...data.storms].sort((a, b) => (basinOf(a) !== CONFIG.defaultBasin) - (basinOf(b) !== CONFIG.defaultBasin));
  storms.forEach(storm => { try {
    const on = basinOf(storm) === CONFIG.defaultBasin;
    const keys = stormKeys[storm.id] = [];
    const wrap = document.createElement("div");
    wrap.className = "storm";
    wrap.innerHTML = `<label class="row storm-head"><input type="checkbox" ${on ? "checked" : ""} data-storm="${esc(storm.id)}">` +
      `<span class="storm-name">${esc(storm.name)}</span><span class="basin-tag">${esc(BASIN_NAME[basinOf(storm)] || basinOf(storm))}</span></label>`;
    const body = document.createElement("div");
    body.className = "storm-body";
    body.hidden = !on;
    wrap.appendChild(body);
    if (storm.demo) body.insertAdjacentHTML("beforeend", '<p class="note warn">這是虛構的示範路徑，接上真實資料來源後會自動替換。</p>');
    if (storm.best.length) {
      const bestKey = storm.id + ":best";
      trackLayers[bestKey] = drawBest(storm);
      keys.push(bestKey);
      body.insertAdjacentHTML("beforeend", `<label class="row"><input type="checkbox" checked data-key="${bestKey}"> 實測路徑</label>`);
    }

    const newest = Math.max(...storm.forecasts.map(f => Date.parse(f.init)));
    const fmtInit = iso => { const d = new Date(iso); return `${String(d.getUTCMonth() + 1).padStart(2, "0")}/${String(d.getUTCDate()).padStart(2, "0")} ${String(d.getUTCHours()).padStart(2, "0")}Z 起報`; };
    ["official", "nwp", "ai"].forEach(cat => {
      const ORDER = ["JTWC", "OFCL", "RJTD", "RCTP"];
      const rank = m => (ORDER.indexOf(m) + 1) || 99;
      const list = storm.forecasts.filter(f => f.category === cat).sort((a, b) => rank(a.model) - rank(b.model));
      if (!list.length) return;
      body.insertAdjacentHTML("beforeend", `<div class="cat">${CAT_NAME[cat]}</div>`);
      list.forEach((f, i) => {
        const color = CONFIG.modelColors[f.model] || CONFIG.palette[cat][i % CONFIG.palette[cat].length];
        f.tauLabels = cat === "official" && i === 0;   // 只在第一條官方路徑標 24h、48h…，避免文字重疊
        const key = `${storm.id}:${f.model}`;
        const stale = newest - Date.parse(f.init) >= 12 * 3600000;   // 比最新的預報早 12 小時以上
        trackLayers[key] = drawForecast(f, color);
        keys.push(key);
        body.insertAdjacentHTML("beforeend",
          `<label class="row model"><input type="checkbox" checked data-key="${key}"><span class="swatch ${cat}" style="border-top-color:${color}"></span>` +
          `<span class="model-text">${esc(f.label)}<span class="model-init${stale ? " stale" : ""}">${fmtInit(f.init)}${stale ? "（較舊）" : ""}</span></span>` +
          `<span class="model-code">${esc(f.model)}</span></label>`);
      });
    });

    // 系集成員：每個系集一個勾選框，預設不顯示（線很多）
    const ens = {};
    storm.forecasts.filter(f => f.category === "ens").forEach(f => (ens[f.group] ||= []).push(f));
    const groups = Object.keys(ens);
    if (groups.length) body.insertAdjacentHTML("beforeend", `<div class="cat">系集成員</div>`);
    groups.forEach((name, i) => {
      const color = CONFIG.groupColors[name] || CONFIG.palette.ens[i % CONFIG.palette.ens.length];
      const key = `${storm.id}:ens:${name}`;
      const g = L.layerGroup();
      ens[name].forEach(f => L.polyline(unwrap(f.points), { pane: "tracks", color, weight: 1, opacity: 0.55 })
        .bindTooltip(`<b>${esc(f.model)}</b>　${fmtInit(f.init)}`, { className: "tc-tip", sticky: true }).addTo(g));
      trackLayers[key] = g;
      keys.push(key);
      const init = ens[name].map(f => f.init).sort().pop();
      body.insertAdjacentHTML("beforeend",
        `<label class="row model"><input type="checkbox" data-key="${key}"><span class="swatch" style="border-top:1.5px solid ${color}"></span>` +
        `<span class="model-text">${esc(name)}<span class="model-init">${ens[name].length} 條・${fmtInit(init)}</span></span></label>`);
    });
    box.appendChild(wrap);
    wrap.querySelectorAll("[data-key],[data-storm]").forEach(cb => {
      const k = cb.dataset.key || "S:" + cb.dataset.storm;
      if (k in prev) cb.checked = prev[k];
    });
    body.hidden = !wrap.querySelector("[data-storm]").checked;
    syncStorm(storm.id);
  } catch (err) {   // 某個颱風的資料有問題時，顯示錯誤訊息，不影響其他颱風
    console.error(err);
    box.insertAdjacentHTML("beforeend", `<p class="note warn">顯示 ${esc(storm.id)} 時出錯：${esc(err.message)}</p>`);
  } });
  document.getElementById("panel").scrollTop = panelScroll;
  // 第一次載入：把畫面移到所有颱風路徑的範圍
  if (tracksFirst) {
    const all = L.featureGroup(Object.values(trackLayers).filter(g => map.hasLayer(g)).flatMap(g => g.getLayers()));
    if (all.getLayers().length) map.fitBounds(all.getBounds(), { paddingTopLeft: [innerWidth > 720 ? 330 : 20, 20], paddingBottomRight: [20, 90] });
  }
  tracksFirst = false;
}
document.getElementById("storms").addEventListener("change", e => {
    const sid = e.target.dataset.storm;
    if (sid !== undefined) {   // 颱風的總開關：收合／展開，並一次開關它所有的路徑
      e.target.closest(".storm").querySelector(".storm-body").hidden = !e.target.checked;
      syncStorm(sid);
      return;
    }
    const wrap = e.target.closest(".storm");
    if (wrap) syncStorm(wrap.querySelector("[data-storm]").dataset.storm);
});

/* ---------- 播放控制 ---------- */
function setFrame(i) { frame = i; slider.value = i; showClock(); showSatFrame(); if (radarLayer) showRadar(); }
slider.addEventListener("input", e => setFrame(+e.target.value));
const playBtn = document.getElementById("play");
let preparing = false;
playBtn.addEventListener("click", () => {
  if (preparing) return;
  if (timer) {
    clearInterval(timer); timer = null; pruneSat();
    playBtn.textContent = "▶"; playBtn.setAttribute("aria-label", "播放動畫"); return;
  }
  if (satMode === "off") return;
  // 先把所有時間的圖下載好（最多等 15 秒），再開始播放
  preparing = true; playBtn.textContent = "…"; playBtn.setAttribute("aria-label", "載入動畫中");
  const groups = times.map((_, i) => { const g = satGroup(i); if (!map.hasLayer(g)) g.addTo(map); return g; });
  let left = groups.length, started = false;
  const start = () => {
    if (started) return; started = true; preparing = false;
    playBtn.textContent = "❚❚"; playBtn.setAttribute("aria-label", "暫停動畫");
    timer = setInterval(() => setFrame((frame + 1) % CONFIG.frames), 700);
  };

/* ---------- 手機版面板開關 ---------- */
const panel = document.getElementById("panel"), tp = document.getElementById("togglePanel");
tp.addEventListener("click", () => { const o = panel.classList.toggle("open"); tp.setAttribute("aria-expanded", o); tp.textContent = o ? "收起" : "圖層"; });

/* ---------- 地面測站風標 ----------
   風標：桿子指向風「吹來」的方向；短羽 = 5 節、長羽 = 10 節、三角旗 = 50 節（國際慣例以節繪製）。
   桿長約 22 像素，和左欄路徑圖例的線一樣長。畫面太擠時，每 36×36 像素只畫一站。 */
const OBS = { staff: 22, spacing: 4, feather: 9, cell: 36 };
map.createPane("obs").style.zIndex = 480;
const obsLayer = L.layerGroup().addTo(map);
let obsData = [];
function barbSVG(ws, wd) {
  const kt = Math.round((ws || 0) * 1.943844 / 5) * 5;
  const halo = (d) => `<path d="${d}" stroke="#0b1620" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>` +
                      `<path d="${d}" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  if (kt < 5 || wd === null || wd === undefined) {   // 靜風或幾乎無風：畫一個圈
    return `<svg width="28" height="28" viewBox="-14 -14 28 28"><circle r="4.5" fill="none" stroke="#0b1620" stroke-width="3.2"/><circle r="4.5" fill="none" stroke="#fff" stroke-width="1.4"/><circle r="1.6" fill="#fff"/></svg>`;
  }
  // 以「風從正北吹來」畫，再整個旋轉到實際風向；羽毛畫在桿子右側（北半球慣例）
  let d = `M0 0 L0 ${-OBS.staff}`, fill = "", y = -OBS.staff, left = kt;
  while (left >= 50) { fill += `M0 ${y} L${OBS.feather} ${y + 2} L0 ${y + 5} Z `; y += 6; left -= 50; }
  while (left >= 10) { d += ` M0 ${y} L${OBS.feather} ${y - 4}`; y += OBS.spacing; left -= 10; }
  if (left >= 5) { if (y === -OBS.staff) y += OBS.spacing; d += ` M0 ${y} L${OBS.feather / 2} ${y - 2}`; }
  const flag = fill ? `<path d="${fill}" fill="#fff" stroke="#0b1620" stroke-width="1"/>` : "";
  return `<svg width="28" height="28" viewBox="-14 -14 28 28"><g transform="rotate(${wd})">${halo(d)}${flag}</g><circle r="2" fill="#fff" stroke="#0b1620" stroke-width="1"/></svg>`;
}
const fmtV = (v, unit, dig = 1) => v === null || v === undefined ? "—" : `${v.toFixed(dig)} ${unit}`;
const DIR16 = ["北", "北北東", "東北", "東北東", "東", "東南東", "東南", "南南東", "南", "南南西", "西南", "西南西", "西", "西北西", "西北", "北北西"];
const hhmm24 = iso => new Date(iso).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
function gustLine(o) {
  if (o.src === "JMA") {   // 氣象廳只有「今天到目前為止的最大瞬間風速」，沒有每 10 分鐘的值
    return o.gustMax !== null && o.gustMax !== undefined
      ? `今日最大瞬間風速 ${fmtV(o.gustMax, "m/s")}${o.gustMaxTime ? `（${hhmm24(o.gustMaxTime)} 發生）` : ""}`
      : `今日最大瞬間風速 —<span style="color:var(--ink-soft)">（只有颱風附近的測站有）</span>`;
  }
  return `瞬間風速 ${fmtV(o.gust, "m/s")}${o.gustTime ? `（${hhmm24(o.gustTime)} 發生）` : ""}`;
}
function obsTip(o) {
  const dir = o.wd === null || o.wd === undefined || (o.ws || 0) < 0.3 ? "靜風" : `${DIR16[Math.round(o.wd / 22.5) % 16]}風（${Math.round(o.wd)}°）`;
  const t = new Date(o.time).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  return `<b>${esc(o.name)}</b>　<span style="color:var(--ink-soft)">${o.src === "CWA" ? "中央氣象署" : "日本氣象廳"}</span><br>` +
    `平均風速 ${fmtV(o.ws, "m/s")}　${dir}<br>${gustLine(o)}<br>` +
    `氣壓（${o.pType}）${fmtV(o.p, "hPa")}<br><span style="color:var(--ink-soft)">觀測 ${t}（本地時間）</span>`;
}
function drawObs() {
  obsLayer.clearLayers();
  if (!document.getElementById("obsToggle").checked || !obsData.length) return;
  const b = map.getBounds().pad(0.1), taken = new Set();
  // 優先順序：中央氣象署 > 日本有人測站 > 其他 AMeDAS
  const rank = o => o.src === "CWA" ? 0 : o.manned ? 1 : 2;
  [...obsData].sort((a, c) => rank(a) - rank(c)).forEach(o => {
    if (o.ws === null || o.ws === undefined) return;
    for (const off of [0, -360, 360]) {
      const ll = L.latLng(o.lat, o.lon + off);
      if (!b.contains(ll)) continue;
      const pt = map.latLngToContainerPoint(ll);
      const cell = `${Math.floor(pt.x / OBS.cell)},${Math.floor(pt.y / OBS.cell)}`;
      if (taken.has(cell)) continue;
      taken.add(cell);
      L.marker(ll, { pane: "obs", keyboard: false, icon: L.divIcon({ className: "obs-icon", html: barbSVG(o.ws, o.wd), iconSize: [28, 28], iconAnchor: [14, 14] }) })
        .bindTooltip(obsTip(o), { className: "tc-tip", direction: "top", offset: [0, -6] })
        .on("click", () => openChart(o)).addTo(obsLayer);
    }
  });
}
// 上一次成功讀到的測站資料存在瀏覽器裡：重新整理時先顯示它，就算新資料一時讀不到，風標也不會消失
const OBS_CACHE_KEY = "tc-site-stations";
function obsFromCache() {
  try {
    const c = JSON.parse(localStorage.getItem(OBS_CACHE_KEY));
    if (c && c.stations && Date.now() - c.saved < 3 * 3600000) return c.stations;
  } catch {}
  return [];
}
let obsRetry = 0;
function obsNoteText() {
  const parts = [["CWA", "中央氣象署"], ["JMA", "日本氣象廳"]].map(([src, label]) => {
    const list = obsData.filter(o => o.src === src);
    if (!list.length) return `${label}：目前沒有資料`;
    const newest = Math.max(...list.map(o => Date.parse(o.time)));
    const age = Math.round((Date.now() - newest) / 60000);
    const hm = new Date(newest).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
    return `${label} ${list.length} 站（${hm} 觀測${age > 60 ? "，暫時無法更新" : ""}）`;
  });
  return parts.join("；") + "。畫面較擠時只顯示部分測站，放大可看到更多。";
}
async function loadObs() {
  const note = document.getElementById("obsNote");
  if (!obsData.length) obsData = obsFromCache();
  try {
    const d = await fetch(`data/stations.json?t=${Date.now()}`, { cache: "no-store" }).then(r => { if (!r.ok) throw 0; return r.json(); });
    if (!(d.stations || []).length) throw 0;   // 新檔是空的：保留畫面上原本的資料
    obsData = d.stations;
    obsRetry = 0;
    try { localStorage.setItem(OBS_CACHE_KEY, JSON.stringify({ saved: Date.now(), stations: obsData })); } catch {}
    note.textContent = obsNoteText();
  } catch {
    // 讀取失敗（例如網站剛好在發布新版本）：保留原本的資料，20 秒後再試（最多 3 次）
    note.textContent = obsData.length ? obsNoteText() : "測站資料讀取中…（若持續沒有出現，請確認「更新測站」有正常執行）";
    if (obsRetry++ < 3) setTimeout(loadObs, 20000);
  }
  drawObs();
  // 折線圖開著時，換成這一站的最新資料（滑鼠正停在圖上時先不換，免得數值框突然消失）
  if (chartStation && !chartbox.hidden && !chartbox.matches(":hover")) {
    const o = obsData.find(x => x.src === chartStation.src && x.id === chartStation.id);
    if (o) openChart(o);
  }
}
map.on("moveend", drawObs);
document.getElementById("obsToggle").addEventListener("change", drawObs);
// 測站的自動更新統一放在檔案最後的「自動更新」區塊
loadObs();

/* ---------- 測站過去 24 小時折線圖（Chart.js 第一次點測站時才載入） ---------- */
const CHARTJS = "https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js";
let chartJsReady = null, chart = null, chartReq = 0;
function loadChartJs() {
  return chartJsReady ||= new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = CHARTJS; sc.onload = res; sc.onerror = () => { chartJsReady = null; rej(); };
    document.head.appendChild(sc);
  });
}
const chartbox = document.getElementById("chartbox"), chartMsg = document.getElementById("chartMsg");
document.getElementById("chartClose").addEventListener("click", () => { chartbox.hidden = true; chartStation = null; });
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let chartStation = null;
async function openChart(o) {
  chartStation = o;
  const my = ++chartReq;
  chartbox.hidden = false;
  document.getElementById("chartTitle").textContent = o.name;
  document.getElementById("chartSub").textContent = `${o.src === "CWA" ? "中央氣象署" : "日本氣象廳"}・過去 24 小時・氣壓為${o.pType}氣壓` +
    (o.src === "JMA" ? "・氣象廳不提供每 10 分鐘的瞬間風速" : "");
  chartMsg.textContent = "讀取中…";
  if (chart) { chart.destroy(); chart = null; }
  let h;
  try {
    await loadChartJs();
    h = await fetch(`data/history/${encodeURIComponent(o.src + "_" + o.id)}.json`, { cache: "no-cache" }).then(r => { if (!r.ok) throw 0; return r.json(); });
  } catch {
    if (my === chartReq) chartMsg.textContent = "這個測站還沒有歷史資料。網站每 20 分鐘累積一筆，最多保留 24 小時。";
    return;
  }
  if (my !== chartReq) return;   // 使用者已經點了別的測站
  const xs = h.t.map(m => m * 60000);
  const pts = arr => arr.map((v, i) => ({ x: xs[i], y: v }));
  chartMsg.textContent = xs.length < 2 ? "資料累積中，目前只有 1 筆。" : "";
  const ink = cssVar("--ink"), soft = cssVar("--ink-soft"), rule = cssVar("--rule");
  const hhmm = v => new Date(v).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  // 在滑鼠所在的時間點畫一條垂直參考線
  const crosshair = {
    id: "crosshair",
    afterDatasetsDraw(c) {
      const a = c.tooltip && c.tooltip.getActiveElements && c.tooltip.getActiveElements();
      if (!a || !a.length) return;
      const x = a[0].element.x, { top, bottom } = c.chartArea, g = c.ctx;
      g.save(); g.strokeStyle = soft; g.lineWidth = 1; g.setLineDash([3, 3]);
      g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke(); g.restore();
    },
  };
  chart = new Chart(document.getElementById("chartCanvas"), {
    type: "line", plugins: [crosshair],
    data: { datasets: [
      { label: "平均風速 (m/s)", data: pts(h.ws), yAxisID: "yw", borderColor: "#4cc9f0", backgroundColor: "#4cc9f0", borderWidth: 2, pointRadius: 1.5, spanGaps: true },
      { label: "瞬間風速 (m/s)", data: pts(h.gust), yAxisID: "yw", hidden: !h.gust.some(v => v !== null), borderColor: "#ff9770", backgroundColor: "#ff9770", borderWidth: 1.6, borderDash: [5, 3], pointRadius: 1.5, spanGaps: true },
      { label: "氣壓 (hPa)", data: pts(h.p), yAxisID: "yp", borderColor: "#c9b6ff", backgroundColor: "#c9b6ff", borderWidth: 2, pointRadius: 0, spanGaps: true },
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false, normalized: true,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: ink, boxWidth: 14, boxHeight: 2, font: { size: 12 } } },
        // 滑鼠（或手指）移到圖上：顯示那個時間點的三個數值
        tooltip: {
          backgroundColor: cssVar("--panel-solid"), titleColor: ink, bodyColor: ink, borderColor: rule, borderWidth: 1,
          padding: 10, boxPadding: 4, titleFont: { size: 13 }, bodyFont: { size: 13 },
          callbacks: {
            title: items => new Date(items[0].parsed.x).toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false }),
            label: c => {
              const name = ["平均風速", "瞬間風速", "氣壓"][c.datasetIndex];
              const v = c.raw && c.raw.y;
              if (v === null || v === undefined || Number.isNaN(v)) return `${name}　無資料`;
              return c.datasetIndex === 2 ? `${name}　${v.toFixed(1)} hPa` : `${name}　${v.toFixed(1)} m/s`;
            },
          },
        },
      },
      scales: {
        x: { type: "linear", min: Date.now() - 24 * 3600000, max: Date.now(),
             // 刻度對齊整點：每 3 小時一格（本地時間 0、3、6…點）
             afterBuildTicks: axis => {
               const d = new Date(axis.min); d.setMinutes(0, 0, 0);
               while (d.getHours() % 3 || d.getTime() < axis.min) d.setTime(d.getTime() + 3600000);
               axis.ticks = [];
               for (let t = d.getTime(); t <= axis.max; t += 3 * 3600000) axis.ticks.push({ value: t });
             },
             ticks: { color: soft, callback: hhmm, maxRotation: 0, autoSkip: true }, grid: { color: rule } },
        yw: { position: "left", beginAtZero: true, title: { display: true, text: "風速 m/s", color: soft },
              ticks: { color: soft }, grid: { color: rule } },
        yp: { position: "right", title: { display: true, text: "氣壓 hPa", color: soft },
              // 上下界至少相差 5 hPa（取整數），避免氣壓幾乎不變時，微小起伏被放大成劇烈變化
              afterDataLimits: axis => {
                const lo = axis.min, hi = axis.max, minSpan = 5;
                if (!Number.isFinite(lo) || !Number.isFinite(hi)) return;
                if (hi - lo < minSpan) {
                  axis.min = Math.floor(lo - (minSpan - (hi - lo)) / 2);
                  axis.max = Math.max(axis.min + minSpan, Math.ceil(hi));
                }
              },
              ticks: { color: soft }, grid: { drawOnChartArea: false } },
      },
    },
  });
}

/* ---------- 游標經緯度 ---------- */
const coordVal = document.getElementById("coordVal");
function showCoords(ll) {
  const lat = ll.lat, lon = ((ll.lng + 180) % 360 + 360) % 360 - 180;   // 經度換回 -180～180
  const f = (v, pos, neg) => `${Math.abs(v).toFixed(2)}°${v >= 0 ? pos : neg}`;
  coordVal.textContent = `${f(lat, "N", "S")}  ${f(lon, "E", "W")}`;
  coordVal.classList.remove("idle");
}

/* ---------- 游標處的雷達回波與海溫：讀取圖磚上該點的顏色，再對照色表換回數值 ---------- */

const RADAR_PAL = [

const nearest = (pal, r, g, b, a) => {
  let best = null, bd = Infinity;
  for (const c of pal) {
    const d = (c[0] - r) ** 2 + (c[1] - g) ** 2 + (c[2] - b) ** 2 + (a === undefined ? 0 : 0.5 * (c[3] - a) ** 2);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
};

// 下載並快取單一張圖磚的像素（與畫面上顯示的圖層分開，讀不到也不影響顯示）
const tileCache = new Map();
function tilePixels(url) {
  if (!tileCache.has(url)) {
    tileCache.set(url, fetch(url)
      .then(r => r.ok ? r.blob() : Promise.reject("empty"))
      .then(b => createImageBitmap(b))
      .then(bmp => {
        const c = document.createElement("canvas");
        c.width = bmp.width; c.height = bmp.height;
        const g = c.getContext("2d", { willReadFrequently: true });
        g.drawImage(bmp, 0, 0);
        return g.getImageData(0, 0, c.width, c.height);
      })
      .catch(e => e === "empty" ? "empty" : "blocked"));
    if (tileCache.size > 80) tileCache.delete(tileCache.keys().next().value);
  }
  return tileCache.get(url);
}
async function samplePixel(template, maxZ, ll) {
  const z = Math.max(0, Math.min(Math.round(map.getZoom()), maxZ)), n = 2 ** z;
  const p = map.project(ll, z);
  const ty = Math.floor(p.y / 256);
  if (ty < 0 || ty >= n) return "empty";
  let tx = Math.floor(p.x / 256);
  const fx = (p.x - tx * 256) / 256, fy = (p.y - ty * 256) / 256;
  tx = ((tx % n) + n) % n;
  const img = await tilePixels(L.Util.template(template, { z, x: tx, y: ty }));
  if (typeof img === "string") return img;
  const px = Math.min(img.width - 1, Math.floor(fx * img.width)), py = Math.min(img.height - 1, Math.floor(fy * img.height));
  const i = (py * img.width + px) * 4;
  return img.data.slice(i, i + 4);
}
function radarText(px) {
  if (px === "blocked") return "無法讀取";
  if (px === "empty" || px[3] < 12) return "無回波";
  const c = nearest(RADAR_PAL, px[0], px[1], px[2], px[3]);
  return c[4] < 5 ? "<b>&lt;5</b> dBZ" : `<b>${c[4]}</b> dBZ${c[5] ? "（雪）" : ""}`;
}
function sstText(px) {
  if (px === "blocked") return "無法讀取";
  if (px === "empty" || px[3] < 128) return "陸地或無資料";
  const key = `${px[0]},${px[1]},${px[2]}`;
  const i = SST_KEY.has(key) ? SST_KEY.get(key) : SST_RGB.indexOf(nearest(SST_RGB, px[0], px[1], px[2]));
  if (i === 0) return "<b>&lt;0</b> °C";
  if (i === SST_RGB.length - 1) return "<b>≥32</b> °C";
  return `<b>${((i - 1) * 0.15 + 0.075).toFixed(1)}</b> °C`;
}
const coordSub = document.getElementById("coordSub");
let readSeq = 0;
async function updateReadout(ll) {
  const my = ++readSeq;
  const jobs = [];
  if (radarLayer && radarUrl) jobs.push(samplePixel(radarUrl, 7, ll).then(px => `<span class="k">雷達</span>${radarText(px)}`));
  if (sstLayer && sstUrl) jobs.push(samplePixel(sstUrl, 7, ll).then(px => `<span class="k">海溫</span>${sstText(px)}`));
  if (!jobs.length) { coordSub.hidden = true; return; }
  const parts = await Promise.all(jobs);
  if (my !== readSeq) return;   // 滑鼠已經移到別處，丟掉過時的結果
  coordSub.innerHTML = parts.join('<span class="sep">│</span>');
  coordSub.hidden = false;
}
let lastLL = null;
function onPointer(ll) { lastLL = ll; showCoords(ll); updateReadout(ll); }
map.on("mousemove", e => onPointer(e.latlng));
map.on("click", e => onPointer(e.latlng));   // 手機沒有滑鼠，點一下地圖也會顯示
map.on("mouseout", () => {
  readSeq++; lastLL = null;
  coordVal.textContent = "移到地圖上"; coordVal.classList.add("idle"); coordSub.hidden = true;
});
// 勾選或取消雷達、海溫，以及切換時間時，立刻更新游標處的數值
["radarToggle", "sstToggle"].forEach(id => document.getElementById(id).addEventListener("change", () => setTimeout(() => lastLL && updateReadout(lastLL), 300)));

/* ---------- 自動更新：網頁開著時，各項資料定期重新讀取 ----------
   衛星雲圖：每 5 分鐘（停在最新一張時會自動跳到新圖）  雷達：每 5 分鐘
   測站與折線圖：每 5 分鐘  颱風路徑：每 5 分鐘（有新資料才重畫）  海溫：每小時檢查是否換日 */
function refreshRadar() {
  radarFrames = [];   // 清掉舊的時間清單，下次顯示時重新向 RainViewer 取得
  if (document.getElementById("radarToggle").checked) showRadar();
}
function refreshSst() {
  const cb = document.getElementById("sstToggle");
  if (cb.checked && sstShownDay !== sstDay()) cb.dispatchEvent(new Event("change"));
}
function refreshAll() {
  refreshLatest(); refreshRadar(); loadObs(); loadTracks(); refreshSst();
}
setInterval(refreshRadar, 5 * 60000);
setInterval(loadObs, 5 * 60000);
setInterval(loadTracks, 5 * 60000);
setInterval(refreshSst, 60 * 60000);
// 手機切到別的 App 或電腦切換分頁時，計時器可能被暫停；回到網頁時立刻全部更新一次
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (Date.now() - hiddenAt > 60000) refreshAll();
});

showClock(); buildSat(true); drawGrid(); loadTracks(); refreshLatest();
