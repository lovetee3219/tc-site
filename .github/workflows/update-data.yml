# 每 3 小時自動執行一次：下載最新路徑資料，存回 data/ 資料夾，並直接發布網站。
# 你上傳或修改檔案時也會自動執行一次；也可以到 Actions 頁面按「Run workflow」手動執行。
name: 更新資料

on:
  schedule:
    - cron: "17 */3 * * *"   # UTC 時間每 3 小時的第 17 分
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 同一時間只跑一個，避免兩次更新互相覆蓋
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install eccodes ecmwf-opendata

      - name: 準備海岸線檔案（只有第一次會真的執行）
        run: python scripts/build_coast.py

      - name: 下載路徑預報
        run: python scripts/fetch_tracks.py
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}   # 中央氣象署授權碼，存在 GitHub Secret 裡

      - name: 存回儲存庫
        # 存回失敗（例如剛好有人同時改了檔案）也不中斷，網站照樣發布，下次執行會再存
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "資料沒有變動"; exit 0; fi
          git commit -m "自動更新資料 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 最多試 3 次：先取得遠端最新版本，資料檔衝突時以這次剛抓的新資料為準
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "第 $i 次存回失敗，10 秒後重試"; sleep 10
          done
          exit 1

      # 測站的過去 24 小時觀測存在 GitHub 的快取裡，每次執行接著累積
      - uses: actions/cache@v5
        with:
          path: .cache
          key: stations-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stations-history-

      - name: 下載測站觀測（不存進儲存庫，只隨網站發布）
        id: stations
        run: python scripts/fetch_stations.py
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        continue-on-error: true

      - name: 測站資料下載失敗時，沿用網站上現有的版本（避免發布出沒有測站的網站）
        if: steps.stations.outcome == 'failure'
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import fetch_stations as f; u = f.site_url(); open('data/stations.json', 'wb').write(f.http_get(u + 'data/stations.json'))" || echo "網站上也沒有測站資料"

      # ↓ 直接把網站發布出去，不必等 GitHub 另外觸發
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      # 發布偶爾會因為「上一次發布還在進行中」而失敗，所以等 2 分鐘再試一次
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: 等待後重試發布
        if: steps.deployment.outcome == 'failure'
        run: sleep 120

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
