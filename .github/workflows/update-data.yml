# 每 20 分鐘執行一次：抓官方預報（JTWC、JMA、CWA）與 NCAR 路徑檔；
# 各模式（ECMWF、GFS、AIFS、FNV3、WN3C）則依 scripts/fetch_tracks.py 裡 SCHEDULE 的時間更新，
# 沒有新資料時每 20 分鐘再試，兩小時後放棄。每次的結果都記在網站的「更新紀錄」頁（保留 48 小時）。
# 上傳檔案或按「Run workflow」手動執行時，所有模式一律立刻更新。
# 路徑資料不再存進儲存庫（避免儲存庫越長越大），而是放在 GitHub 快取並隨網站發布。
name: 更新資料

on:
  schedule:
    - cron: "5-59/20 * * * *"   # 每小時的 05、25、45 分
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 和「更新測站」共用同一個佇列，不會同時發布網站
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install eccodes ecmwf-opendata numpy scipy copernicusmarine

      # 各模式上次的資料、更新狀態、更新紀錄、測站歷史都存在 GitHub 快取，每次執行接著用
      - uses: actions/cache@v5
        with:
          path: .cache
          key: stations-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stations-history-

      - name: 準備海岸線檔案（只有第一次會真的執行）
        run: python scripts/build_coast.py

      - name: 下載路徑預報
        id: tracks
        run: python scripts/fetch_tracks.py
        continue-on-error: true
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          FORCE_ALL: ${{ github.event_name != 'schedule' && '1' || '0' }}   # 手動執行或上傳檔案時，全部立刻更新

      - name: 路徑預報失敗時，沿用上一次的版本
        if: steps.tracks.outcome == 'failure'
        run: python scripts/restore_published.py

      - name: 下載海溫與海洋熱含量（不存進儲存庫，只隨網站發布）
        run: python scripts/fetch_grids.py
        continue-on-error: true
        env:   # Copernicus Marine 免費帳號，用來計算海洋熱含量
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}

      - name: 下載測站觀測（不存進儲存庫，只隨網站發布）
        id: stations
        run: python scripts/fetch_stations.py
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        continue-on-error: true

      - name: 測站資料下載失敗時，沿用網站上現有的版本（避免發布出沒有測站的網站）
        if: steps.stations.outcome == 'failure'
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import fetch_stations as f; u = f.site_url(); open('data/stations.json', 'wb').write(f.http_get(u + 'data/stations.json'))" || echo "網站上也沒有測站資料"
          python -c "import sys; sys.path.insert(0, 'scripts'); import fetch_stations as f; f.save_history([])" || echo "歷史資料也無法產生"

      # ↓ 直接把網站發布出去
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      # 發布偶爾會因為「上一次發布還在進行中」而失敗，所以等 2 分鐘再試一次
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: 等待後重試發布
        if: steps.deployment.outcome == 'failure'
        run: sleep 120

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
