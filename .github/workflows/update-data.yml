# 每 3 小時自動執行一次：下載最新路徑與風場資料，存回 data/ 資料夾。
# 也可以到 GitHub 的 Actions 頁面按「Run workflow」手動執行。
name: 更新資料

on:
  schedule:
    - cron: "17 */3 * * *"   # UTC 時間每 3 小時的第 17 分
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install xarray cfgrib eccodes numpy

      - name: 準備海岸線檔案（只有第一次會真的執行）
        run: python scripts/build_coast.py

      - name: 下載路徑預報
        run: python scripts/fetch_tracks.py

      - name: 下載 GFS 風場
        run: python scripts/fetch_wind.py
        continue-on-error: true   # 風場失敗時，仍保留路徑資料的更新

      - name: 存回儲存庫
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "自動更新資料 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
